<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShrekBook Virtual Items Shop 🧌</title>

    <link
        rel="icon"
        type="image/png"
        href="/favicon.png">

    <link
        rel="stylesheet"
        href="/styles.css">

    <style>

        /* ==================================================
           SVIS GLOW-UP
        ================================================== */

        :root {

            --shop-radius: 20px;

        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #f5f7f2 0%,
                    #eef5e9 50%,
                    #f8f8f8 100%
                );

        }


        /* ==================================================
           HERO
        ================================================== */

        .shop-container {

            max-width: 1200px;

            margin: 0 auto;

            padding: 35px 20px 70px;

        }


        .shop-header {

            text-align: center;

            margin-bottom: 30px;

        }


        .shop-header h1 {

            font-size: clamp(
                32px,
                5vw,
                52px
            );

            margin: 10px 0;

            letter-spacing: -1px;

        }


        .shop-header p {

            color: #666;

            font-size: 17px;

            max-width: 650px;

            margin: 0 auto;

            line-height: 1.6;

        }


        .hero-badge {

            display: inline-block;

            padding: 7px 13px;

            border-radius: 999px;

            background: rgba(
                120,
                180,
                80,
                0.12
            );

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        /* ==================================================
           COINS
        ================================================== */

        .coin-balance {

            display: inline-flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            margin: 25px auto;

            padding: 14px 24px;

            border-radius: 999px;

            background: white;

            box-shadow:
                0 8px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

            font-size: 18px;

            font-weight: bold;

        }


        .coin-icon {

            font-size: 25px;

        }


        #shrekcoins {

            font-size: 25px;

        }


        /* ==================================================
           CONTROLS
        ================================================== */

        .shop-controls {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 25px;

            padding: 15px;

            background: rgba(
                255,
                255,
                255,
                0.8
            );

            backdrop-filter:
                blur(12px);

            border-radius: 18px;

            box-shadow:
                0 5px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.05
                );

        }


        .shop-search {

            flex: 1;

            min-width: 200px;

            padding: 12px 15px;

            border:
                1px solid #ddd;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

        }


        .shop-search:focus {

            border-color: #8bbd62;

            box-shadow:
                0 0 0 3px
                rgba(
                    139,
                    189,
                    98,
                    0.15
                );

        }


        .shop-filter,
        .shop-sort {

            padding: 12px 14px;

            border:
                1px solid #ddd;

            border-radius: 12px;

            background: white;

            cursor: pointer;

            font-size: 14px;

        }


        /* ==================================================
           FEATURED
        ================================================== */

        .featured-section {

            margin-bottom: 30px;

        }


        .section-title {

            font-size: 23px;

            margin:
                0 0 15px;

        }


        .featured-card {

            display: grid;

            grid-template-columns:
                150px 1fr auto;

            align-items: center;

            gap: 25px;

            padding: 20px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    white,
                    #f2f8ed
                );

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

            overflow: hidden;

        }


        .featured-preview {

            width: 150px;

            height: 150px;

            border-radius: 18px;

            overflow: hidden;

            background: #eee;

        }


        .featured-preview img {

            width: 100%;

            height: 100%;

            object-fit: contain;

        }


        .featured-info h2 {

            margin:
                0 0 8px;

        }


        .featured-info p {

            color: #666;

            line-height: 1.5;

        }


        .featured-price {

            font-size: 22px;

            font-weight: bold;

            margin-top: 10px;

        }


        /* ==================================================
           GRID
        ================================================== */

        .shop-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );

            gap: 22px;

        }


        /* ==================================================
           ITEM CARD
        ================================================== */

        .shop-item {

            position: relative;

            background: white;

            border-radius:
                var(--shop-radius);

            padding: 20px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.07
                );

            transition:
                transform .2s ease,
                box-shadow .2s ease;

            animation:
                cardIn .35s ease both;

        }


        .shop-item:hover {

            transform:
                translateY(-7px);

            box-shadow:
                0 15px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

        }


        @keyframes cardIn {

            from {

                opacity: 0;

                transform:
                    translateY(10px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .item-badge {

            position: absolute;

            top: 12px;

            right: 12px;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: bold;

            background: #edf6e7;

        }


        .item-icon {

            display: flex;

            align-items: center;

            justify-content: center;

            height: 180px;

            font-size: 65px;

        }


        /* ==================================================
           AVATAR PREVIEW
        ================================================== */

        .avatar-preview {

            width: 100%;

            height: 220px;

            margin-bottom: 15px;

            border-radius: 16px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle,
                    #f8faf5,
                    #e9eee5
                );

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .avatar-preview img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            transition:
                transform .25s ease;

        }


        .shop-item:hover
        .avatar-preview img {

            transform:
                scale(1.05);

        }


        .avatar-loading {

            color: #777;

            font-size: 14px;

        }


        /* ==================================================
           TEXT
        ================================================== */

        .shop-item h2 {

            margin:
                10px 0 8px;

            font-size: 20px;

        }


        .item-description {

            color: #666;

            min-height: 55px;

            line-height: 1.45;

            font-size: 14px;

        }


        .item-price {

            font-size: 20px;

            font-weight: bold;

            margin: 16px 0;

        }


        /* ==================================================
           BUTTON
        ================================================== */

        .buy-button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            background:
                #eeeeee;

            transition:
                transform .15s ease,
                opacity .15s ease;

        }


        .buy-button:hover {

            transform:
                scale(1.02);

            opacity: .85;

        }


        .buy-button:active {

            transform:
                scale(.98);

        }


        .buy-button:disabled {

            opacity: .5;

            cursor: not-allowed;

            transform: none;

        }


        /* ==================================================
           LOADING / ERROR
        ================================================== */

        .shop-loading {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 60px;

            color: #777;

            font-size: 18px;

        }


        .shop-error {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 50px;

            color: #c00;

            background: white;

            border-radius: 18px;

        }


        .no-results {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 60px;

            color: #777;

        }


        /* ==================================================
           TOAST
        ================================================== */

        #toast-container {

            position: fixed;

            right: 20px;

            bottom: 20px;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .toast {

            padding:
                13px 17px;

            border-radius: 13px;

            background: #222;

            color: white;

            box-shadow:
                0 8px 25px
                rgba(
                    0,
                    0,
                    0,
                    .2
                );

            animation:
                toastIn .25s ease;

        }


        @keyframes toastIn {

            from {

                opacity: 0;

                transform:
                    translateY(10px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (
            max-width: 700px
        ) {

            .featured-card {

                grid-template-columns:
                    1fr;

                text-align: center;

            }


            .featured-preview {

                margin:
                    0 auto;

            }


            .shop-container {

                padding:
                    25px 14px 50px;

            }

        }


    </style>

</head>

</header>


<!-- ==================================================

<main class="shop-container">


    <div class="shop-header">

        </div>

        <p>

<script>

/* ==================================================
   GLOBAL
================================================== */

let shopItems = [];


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==================================================
   TOAST
================================================== */

function showToast(
    message
) {

    const container =
        document.getElementById(
            "toast-container"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.remove();

        },
        3000
    );

}


/* ==================================================
   LOAD SHREKCOINS
================================================== */

async function loadShrekCoins() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.loggedIn
        ) {

            document.getElementById(
                "shrekcoins"
            ).textContent =
                "Not logged in";

            return;

        }


        const coins =
            data.user &&
            data.user.shrekcoins !== undefined
                ? Number(
                    data.user.shrekcoins
                )
                : 0;


        document.getElementById(
            "shrekcoins"
        ).textContent =
            coins.toLocaleString();


    } catch (error) {

        console.error(
            "COIN LOAD ERROR:",
            error
        );


        document.getElementById(
            "shrekcoins"
        ).textContent =
            "Error";

    }

}


/* ==================================================
   LOAD .SB AVATAR PREVIEW
================================================== */

async function loadAvatarPreview(
    itemValue,
    container,
    itemName
) {

    if (!container) {

        console.error(
            "❌ Avatar preview container not found."
        );

        return;

    }


    try {

        container.innerHTML = `

            <div class="avatar-loading">

                🧌 Loading avatar...

            </div>

        `;


        if (!itemValue) {

            throw new Error(
                "No avatar file URL."
            );

        }


        const response =
            await fetch(
                itemValue
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const avatar =
            await response.json();


        if (
            avatar.format !==
            "ShrekBook"
        ) {

            throw new Error(
                "Invalid ShrekBook file."
            );

        }


        if (
            avatar.file_type !==
            "sb"
        ) {

            throw new Error(
                "Not a .sb file."
            );

        }


        if (
            !avatar.image ||
            !avatar.image.startsWith(
                "data:image/"
            )
        ) {

            throw new Error(
                "No image found in .sb file."
            );

        }


        const image =
            document.createElement(
                "img"
            );


        image.src =
            avatar.image;


        image.alt =
            `${itemName || "ShrekBook"} Avatar Preview`;


        image.loading =
            "lazy";


        container.replaceChildren(
            image
        );


    } catch (error) {

        console.error(
            "❌ AVATAR PREVIEW ERROR:",
            error
        );


        container.innerHTML = `

            <div class="avatar-loading">

                ❌ Preview unavailable.

            </div>

        `;

    }

}


/* ==================================================
   FILTER + SORT
================================================== */

function getVisibleItems() {

    const search =
        document.getElementById(
            "shop-search"
        ).value
            .trim()
            .toLowerCase();


    const filter =
        document.getElementById(
            "shop-filter"
        ).value;


    const sort =
        document.getElementById(
            "shop-sort"
        ).value;


    let items =
        [...shopItems];


    /* SEARCH */

    if (search) {

        items =
            items.filter(
                item => {

                    const text =
                        [
                            item.name,
                            item.description,
                            item.item_type
                        ]
                            .join(" ")
                            .toLowerCase();

                    return text.includes(
                        search
                    );

                }
            );

    }


    /* FILTER */

    if (filter !== "all") {

        items =
            items.filter(
                item => {

                    if (
                        filter ===
                        "other"
                    ) {

                        return (
                            item.item_type !==
                                "avatar" &&
                            item.item_type !==
                                "title"
                        );

                    }

                    return (
                        item.item_type ===
                        filter
                    );

                }
            );

    }


    /* SORT */

    if (
        sort ===
        "price-low"
    ) {

        items.sort(
            (a, b) =>
                Number(a.price || 0) -
                Number(b.price || 0)
        );

    }


    if (
        sort ===
        "price-high"
    ) {

        items.sort(
            (a, b) =>
                Number(b.price || 0) -
                Number(a.price || 0)
        );

    }


    if (
        sort ===
        "name"
    ) {

        items.sort(
            (a, b) =>
                String(
                    a.name || ""
                ).localeCompare(
                    String(
                        b.name || ""
                    )
                )
        );

    }


    if (
        sort ===
        "newest"
    ) {

        items.sort(
            (a, b) =>
                Number(b.id || 0) -
                Number(a.id || 0)
        );

    }


    return items;

}


/* ==================================================
   RENDER SHOP
================================================== */

function renderShop() {

    const grid =
        document.getElementById(
            "shop-grid"
        );


    const visibleItems =
        getVisibleItems();


    grid.innerHTML = "";


    if (
        visibleItems.length === 0
    ) {

        grid.innerHTML = `

            <div class="no-results">

                🔎 Nothing found in the swamp.

                <br><br>

                Try another search.

            </div>

        `;

        return;

    }


    visibleItems.forEach(
        (
            item,
            index
        ) => {

            /* ==========================================
               ITEM DATA
            ========================================== */

            const databaseId =
                Number(item.id);


            const name =
                item.name ||
                "Unnamed Item";


            const description =
                item.description ||
                "No description available.";


            const price =
                Number(item.price) || 0;


            const icon =
                item.icon ||
                "🧌";


            const owned =
                item.owned === true;


            /*
             * IMPORTANT:
             *
             * Define isAvatar BEFORE
             * using it in card.innerHTML.
             */

            const isAvatar =
                item.item_type ===
                "avatar";


            const isTitle =
                item.item_type ===
                "title";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "shop-item";


            card.style.animationDelay =
                `${Math.min(
                    index * 35,
                    500
                )}ms`;


            /* ==========================================
               CARD HTML
            ========================================== */

            card.innerHTML = `

                ${
                    isAvatar
                        ? `

                            <div
                                class="item-badge">

                                🧌 AVATAR

                            </div>


                            <div
                                class="avatar-preview">

                                <div
                                    class="avatar-loading">

                                    🧌 Loading avatar...

                                </div>

                            </div>

                        `
                        : `

                            <div
                                class="item-icon">

                                ${escapeHtml(
                                    icon
                                )}

                            </div>

                        `
                }


                <h2>

                    ${escapeHtml(
                        name
                    )}

                </h2>


                <p
                    class="item-description">

                    ${escapeHtml(
                        description
                    )}

                </p>


                <div
                    class="item-price">

                    🪙 ${price.toLocaleString()}

                </div>


                <button
                    class="buy-button"
                    data-item-id="${databaseId}"
                    ${owned ? "disabled" : ""}>

                    ${
                        owned
                            ? "✅ Owned"
                            : "Buy"
                    }

                </button>

            `;


            /* ==========================================
               AVATAR PREVIEW
            ========================================== */

            if (isAvatar) {

                const preview =
                    card.querySelector(
                        ".avatar-preview"
                    );


                loadAvatarPreview(
                    item.item_value,
                    preview,
                    name
                );

            }


            /* ==========================================
               BUY BUTTON
            ========================================== */

            const button =
                card.querySelector(
                    ".buy-button"
                );


            if (!owned) {

                button.addEventListener(
                    "click",
                    () => {

                        buyItem(
                            databaseId,
                            button
                        );

                    }
                );

            }


            grid.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   FEATURED AVATAR
================================================== */

function renderFeaturedAvatar() {

    const section =
        document.getElementById(
            "featured-section"
        );


    const container =
        document.getElementById(
            "featured-card"
        );


    const avatars =
        shopItems.filter(
            item =>
                item.item_type ===
                "avatar"
        );


    if (
        avatars.length === 0
    ) {

        section.style.display =
            "none";

        return;

    }


    /*
     * Highest-priced avatar
     * becomes featured.
     */

    const featured =
        [...avatars].sort(
            (a, b) =>
                Number(b.price || 0) -
                Number(a.price || 0)
        )[0];


    const price =
        Number(
            featured.price
        ) || 0;


    const owned =
        featured.owned === true;


    container.innerHTML = `

        <div
            class="featured-card">

            <div
                class="featured-preview"
                id="featured-preview">

                🧌

            </div>


            <div
                class="featured-info">

                <h2>

                    ${escapeHtml(
                        featured.name ||
                        "Featured Avatar"
                    )}

                </h2>


                <p>

                    ${escapeHtml(
                        featured.description ||
                        "A mysterious avatar from the swamp."
                    )}

                </p>


                <div
                    class="featured-price">

                    🪙
                    ${price.toLocaleString()}

                </div>

            </div>


            <button
                class="buy-button"
                id="featured-buy"
                ${owned ? "disabled" : ""}>

                ${
                    owned
                        ? "✅ Owned"
                        : "Buy Avatar"
                }

            </button>

        </div>

    `;


    const preview =
        document.getElementById(
            "featured-preview"
        );


    loadAvatarPreview(
        featured.item_value,
        preview,
        featured.name
    );


    if (!owned) {

        document
            .getElementById(
                "featured-buy"
            )
            .addEventListener(
                "click",
                event => {

                    buyItem(
                        Number(
                            featured.id
                        ),
                        event.currentTarget
                    );

                }
            );

    }


    section.style.display =
        "block";

}


/* ==================================================
   LOAD SHOP ITEMS
================================================== */

async function loadShop() {

    const grid =
        document.getElementById(
            "shop-grid"
        );


    try {

        grid.innerHTML = `

            <div class="shop-loading">

                🧌 Loading the swamp shop...

            </div>

        `;


        const response =
            await fetch(
                "/api/shop/items",
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        console.log(
            "🛒 SHOP ITEMS:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load shop."
            );

        }


        shopItems =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.items
                    )
                        ? data.items
                        : []
                );


        if (
            shopItems.length === 0
        ) {

            grid.innerHTML = `

                <div class="shop-loading">

                    🧌 The shop is empty.

                </div>

            `;

            return;

        }


        renderFeaturedAvatar();

        renderShop();


    } catch (error) {

        console.error(
            "SHOP LOAD ERROR:",
            error
        );


        grid.innerHTML = `

            <div class="shop-error">

                ❌ Failed to load the shop.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* ==================================================
   BUY ITEM
================================================== */

async function buyItem(
    itemId,
    button
) {

    console.log(
        "🛒 BUY ITEM DATABASE ID:",
        itemId
    );


    const numericItemId =
        Number(itemId);


    if (
        !Number.isInteger(
            numericItemId
        ) ||
        numericItemId <= 0
    ) {

        showToast(
            "❌ Invalid shop item ID."
        );

        return;

    }


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "🛒 Buying...";

    }


    try {

        const response =
            await fetch(
                "/api/shop/buy",
                {

                    method:
                        "POST",

                    credentials:
                        "include",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            item_id:
                                numericItemId

                        })

                }
            );


        const data =
            await response.json();


        console.log(
            "🛒 SHOP RESPONSE:",
            data
        );


        if (!response.ok) {

            showToast(
                "❌ " +
                (
                    data.error ||
                    "Purchase failed."
                )
            );


            if (button) {

                button.disabled =
                    false;

                button.textContent =
                    "Buy";

            }


            return;

        }


        /* UPDATE COINS */

        if (
            data.shrekcoins !==
                undefined &&
            data.shrekcoins !==
                null
        ) {

            document.getElementById(
                "shrekcoins"
            ).textContent =
                Number(
                    data.shrekcoins
                ).toLocaleString();

        } else {

            await loadShrekCoins();

        }


        showToast(
            "✅ Item purchased!"
        );


        /*
         * Reload everything so
         * owned state updates.
         */

        await loadShop();


    } catch (error) {

        console.error(
            "🛒 SHOP ERROR:",
            error
        );


        showToast(
            "❌ Could not connect to the shop."
        );


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Buy";

        }

    }

}

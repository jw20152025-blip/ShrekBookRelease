<script>

/* ==================================================
   LOAD SHREKCOINS
================================================== */

async function loadShrekCoins() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.loggedIn
        ) {

            document.getElementById(
                "shrekcoins"
            ).textContent =
                "Not logged in";

            return;
        }

        const coins =
            data.user &&
            data.user.shrekcoins !== undefined
                ? data.user.shrekcoins
                : 0;

        document.getElementById(
            "shrekcoins"
        ).textContent =
            coins;

    } catch (error) {

        console.error(
            "COIN LOAD ERROR:",
            error
        );

        document.getElementById(
            "shrekcoins"
        ).textContent =
            "Error";
    }

}


/* ==================================================
   BUY ITEM
================================================== */

async function buyItem(itemId) {

    console.log(
        "🛒 BUY ITEM DATABASE ID:",
        itemId
    );


    if (!itemId) {

        alert(
            "❌ This item does not have a valid ID."
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/shop/buy",
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        item_id:
                            itemId

                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "🛒 SHOP RESPONSE:",
            data
        );


        if (!response.ok) {

            alert(
                "❌ " +
                (
                    data.error ||
                    "Purchase failed."
                )
            );

            return;
        }


        alert(
            "✅ Item purchased!"
        );


        /* ------------------------------------------
           Update coins immediately
        ------------------------------------------ */

        if (
            data.shrekcoins !== undefined
        ) {

            document.getElementById(
                "shrekcoins"
            ).textContent =
                data.shrekcoins;

        } else {

            await loadShrekCoins();

        }

    } catch (error) {

        console.error(
            "🛒 SHOP ERROR:",
            error
        );

        alert(
            "❌ Could not connect to the shop."
        );

    }

}


/* ==================================================
   START
================================================== */

loadShrekCoins();

</script>

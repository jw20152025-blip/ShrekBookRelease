<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook Profile</title>

</head>


<body>

    <main>

        <img
            id="profile-avatar"
            src="/default-avatar.png"
            alt="Profile avatar"
            width="120"
            height="120"
        >

        <h1 id="profile-display-name">
            Loading...
        </h1>

        <p id="profile-username">
            @user
        </p>


        <!-- =========================================
             REACTIONS
        ========================================== -->

        <div id="reactions">

            <button
                type="button"
                onclick="giveReaction('gyatt')"
            >

                🍑 Gyatt

                <span id="gyatt-count">
                    0
                </span>

            </button>


            <button
                type="button"
                onclick="giveReaction('cat')"
            >

                🐱 Cat

                <span id="cat-count">
                    0
                </span>

            </button>


            <button
                type="button"
                onclick="giveReaction('ogred')"
            >

                🧌 Ogred

                <span id="ogred-count">
                    0
                </span>

            </button>

        </div>

    </main>


    <!-- LOAD PROFILE JS LAST -->

    <script src="/profile.js"></script>

</body>

</html>

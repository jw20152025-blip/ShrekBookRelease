
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile 🧌</title>

    <link
        rel="stylesheet"
        href="/styles.css">
</head>

<body>

<header class="navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="logo">
            🧌 ShrekBook
        </a>

        <nav>
            <a href="/">Home</a>
            <a href="/profile.html">Profile</a>
        </nav>

    </div>

</header>


<main class="container">

    <!-- PROFILE -->

    <section class="profile-card">

        <img
            id="profile-avatar"
            class="profile-avatar"
            src="/default-avatar.png"
            alt="Profile avatar">

        <h1 id="profile-display-name">
            Loading...
        </h1>

        <p id="profile-username">
            Loading...
        </p>

        <p id="profile-bio"></p>


        <!-- REACTIONS -->

        <div class="profile-reactions">

            <button
                onclick="giveReaction('gyatt')">

                🍑 Gyatt

                <span id="gyatt-count">
                    0
                </span>

            </button>


            <button
                onclick="giveReaction('cat')">

                🐱 Cat

                <span id="cat-count">
                    0
                </span>

            </button>


            <button
                onclick="giveReaction('ogred')">

                🧌 Ogred

                <span id="ogred-count">
                    0
                </span>

            </button>

        </div>


        <button
            id="edit-button"
            onclick="showEditProfile()"
            style="display:none;">

            ✏️ Edit Profile

        </button>

    </section>


    <!-- EDIT PROFILE -->

    <section
        id="edit-profile"
        class="auth-box"
        style="display:none;">

        <h2>
            ✏️ Edit Profile
        </h2>


        <label>
            Display name
        </label>

        <input
            id="edit-display-name"
            type="text"
            maxlength="50">


        <label>
            Bio
        </label>

        <textarea
            id="edit-bio"
            maxlength="500"
            placeholder="Tell people about yourself..."></textarea>


        <h3>
            🖼️ Change Avatar
        </h3>

        <input
            id="avatar-input"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif">


        <button
            onclick="uploadAvatar()">

            📸 Upload Avatar

        </button>


        <button
            onclick="saveProfile()">

            💾 Save Profile

        </button>


        <button
            class="secondary-button"
            onclick="hideEditProfile()">

            Cancel

        </button>


        <p id="profile-status"></p>

    </section>


    <!-- POSTS -->

    <section>

        <h2>
            Posts
        </h2>

        <div id="profile-posts">
            Loading posts...
        </div>

    </section>

</main>


<script>

let profileUser = null;


// ==================================================
// GET PROFILE ID
// ==================================================

function getProfileId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");
}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;
}


// ==================================================
// LOAD PROFILE
// ==================================================

async function loadProfile() {

    const id =
        getProfileId();

    const url =
        id
            ? `/api/users/${encodeURIComponent(id)}`
            : "/api/me";

    try {

        const response =
            await fetch(url);

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load profile."
            );

        }


        profileUser =
            id
                ? data
                : data.user;


        if (!profileUser) {

            throw new Error(
                "Profile not found."
            );

        }


        // DISPLAY NAME

        document.getElementById(
            "profile-display-name"
        ).textContent =
            profileUser.display_name ||
            profileUser.username;


        // USERNAME

        document.getElementById(
            "profile-username"
        ).textContent =
            "@" +
            profileUser.username;


        // BIO

        document.getElementById(
            "profile-bio"
        ).textContent =
            profileUser.bio ||
            "No bio yet.";


        // AVATAR

        document.getElementById(
            "profile-avatar"
        ).src =
            profileUser.avatar ||
            "/default-avatar.png";


        // REACTIONS

        document.getElementById(
            "gyatt-count"
        ).textContent =
            profileUser.gyatt || 0;


        document.getElementById(
            "cat-count"
        ).textContent =
            profileUser.cat || 0;


        document.getElementById(
            "ogred-count"
        ).textContent =
            profileUser.ogred || 0;


        // CHECK IF THIS IS OUR PROFILE

        const meResponse =
            await fetch("/api/me");

        const me =
            await meResponse.json();


        if (
            me.loggedIn &&
            me.user &&
            me.user.id === profileUser.id
        ) {

            document.getElementById(
                "edit-button"
            ).style.display =
                "inline-block";

        }


        // POSTS

        loadProfilePosts(
            profileUser.posts || []
        );


    } catch (error) {

        console.error(
            "PROFILE LOAD ERROR:",
            error
        );

        document.getElementById(
            "profile-display-name"
        ).textContent =
            "❌ " + error.message;

    }

}


// ==================================================
// REACTIONS
// ==================================================

async function giveReaction(type) {

    if (!profileUser) {
        return;
    }

    const id =
        profileUser.id;

    try {

        const response =
            await fetch(
                `/api/users/${encodeURIComponent(id)}/${type}`,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Could not give reaction."
            );

            return;
        }


        if (type === "gyatt") {

            document.getElementById(
                "gyatt-count"
            ).textContent =
                data.gyatt;

        }


        if (type === "cat") {

            document.getElementById(
                "cat-count"
            ).textContent =
                data.cat;

        }


        if (type === "ogred") {

            document.getElementById(
                "ogred-count"
            ).textContent =
                data.ogred;

        }


    } catch (error) {

        console.error(
            "REACTION ERROR:",
            error
        );

        alert(
            "Could not give reaction."
        );

    }

}


// ==================================================
// SHOW EDIT
// ==================================================

function showEditProfile() {

    if (!profileUser) {
        return;
    }

    document.getElementById(
        "edit-profile"
    ).style.display =
        "block";


    document.getElementById(
        "edit-display-name"
    ).value =
        profileUser.display_name ||
        profileUser.username ||
        "";


    document.getElementById(
        "edit-bio"
    ).value =
        profileUser.bio ||
        "";

}


// ==================================================
// HIDE EDIT
// ==================================================

function hideEditProfile() {

    document.getElementById(
        "edit-profile"
    ).style.display =
        "none";

}


// ==================================================
// SAVE PROFILE
// ==================================================

async function saveProfile() {

    const display_name =
        document.getElementById(
            "edit-display-name"
        ).value.trim();


    const bio =
        document.getElementById(
            "edit-bio"
        ).value.trim();


    const status =
        document.getElementById(
            "profile-status"
        );


    if (!display_name) {

        status.textContent =
            "❌ Display name cannot be empty.";

        return;

    }


    status.textContent =
        "Saving...";


    try {

        const response =
            await fetch(
                "/api/profile",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        display_name,
                        bio
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not save profile."
            );

        }


        profileUser =
            {
                ...profileUser,
                ...data.user
            };


        document.getElementById(
            "profile-display-name"
        ).textContent =
            profileUser.display_name;


        document.getElementById(
            "profile-bio"
        ).textContent =
            profileUser.bio ||
            "No bio yet.";


        status.textContent =
            "✅ Profile saved!";


        setTimeout(
            hideEditProfile,
            800
        );


    } catch (error) {

        console.error(
            "PROFILE SAVE ERROR:",
            error
        );

        status.textContent =
            "❌ " +
            error.message;

    }

}


// ==================================================
// UPLOAD AVATAR
// ==================================================

async function uploadAvatar() {

    const input =
        document.getElementById(
            "avatar-input"
        );


    const status =
        document.getElementById(
            "profile-status"
        );


    const file =
        input.files[0];


    if (!file) {

        status.textContent =
            "❌ Choose an image first.";

        return;

    }


    if (file.size > 5 * 1024 * 1024) {

        status.textContent =
            "❌ Image must be under 5MB.";

        return;

    }


    status.textContent =
        "Uploading avatar...";


    const reader =
        new FileReader();


    reader.onload = async function () {

        try {

            const base64 =
                reader.result
                    .split(",")[1];


            const response =
                await fetch(
                    "/api/profile/avatar",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            fileName:
                                file.name,

                            fileType:
                                file.type,

                            fileData:
                                base64

                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Avatar upload failed."
                );

            }


            profileUser.avatar =
                data.avatar;


            document.getElementById(
                "profile-avatar"
            ).src =
                data.avatar;


            status.textContent =
                "✅ Avatar updated!";


            input.value = "";


        } catch (error) {

            console.error(
                "AVATAR ERROR:",
                error
            );

            status.textContent =
                "❌ " +
                error.message;

        }

    };


    reader.readAsDataURL(file);

}


// ==================================================
// PROFILE POSTS
// ==================================================

function loadProfilePosts(posts) {

    const container =
        document.getElementById(
            "profile-posts"
        );


    if (!posts.length) {

        container.innerHTML =
            "<p>No posts yet.</p>";

        return;

    }


    container.innerHTML =
        posts.map(post => `

            <article class="post">

                <div class="post-header">

                    <strong>
                        ${escapeHtml(
                            profileUser.display_name ||
                            profileUser.username
                        )}
                    </strong>

                </div>


                <div class="post-content">

                    ${escapeHtml(
                        post.content
                    )}

                </div>

            </article>

        `).join("");

}


// ==================================================
// START
// ==================================================

loadProfile();

</script>

</body>
</html>

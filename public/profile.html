
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <title>Profile - ShrekBook</title>

</head>

<body>

<header>

    <div class="brand">

        <h1>🧌 ShrekBook</h1>

    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/login.html">
            Login
        </a>

    </nav>

</header>


<div class="container">

    <div id="profile">

        Loading profile...

    </div>

</div>


<script>

async function loadProfile() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");

    if (!id) {

        document.getElementById(
            "profile"
        ).innerHTML =
            "<h2>No profile specified.</h2>";

        return;

    }

    try {

        const response =
            await fetch(`/api/users/${id}`);

        if (!response.ok) {
            throw new Error(
                "Profile not found"
            );
        }

        const user =
            await response.json();

        document.getElementById(
            "profile"
        ).innerHTML = `

            <img
                class="profile-avatar"
                src="${user.avatar || "https://placehold.co/200x200"}"
                alt="Avatar"
            >

            <h2>
                ${user.display_name}
            </h2>

            <p>
                @${user.username}
            </p>

            <div class="profile-stats">

                <div class="stat">

                    <strong>
                        ${user.gyatt}
                    </strong>

                    <span>
                        💀 Gyatt
                    </span>

                </div>


                <div class="stat">

                    <strong>
                        ${user.cat}
                    </strong>

                    <span>
                        🐱 Cat
                    </span>

                </div>


                <div class="stat">

                    <strong>
                        ${user.ogred}
                    </strong>

                    <span>
                        🧌 Ogred
                    </span>

                </div>

            </div>

        `;

    } catch (error) {

        console.error(error);

        document.getElementById(
            "profile"
        ).innerHTML =
            "<h2>Profile not found 😭</h2>";

    }

}

loadProfile();

</script>

</body>

</html>

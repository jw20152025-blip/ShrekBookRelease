<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile - ShrekBook 🧌</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header class="navbar">

    <div class="navbar-inner">

        <a href="/" class="logo">
            🧌 ShrekBook
        </a>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/profile.html">
                Profile
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </nav>

    </div>

</header>


<main class="container">

    <section class="profile-section">

        <h1>
            Your Profile 🧌
        </h1>


        <div id="profile">

            Loading profile...

        </div>


        <hr>


        <h2>
            Edit Profile
        </h2>


        <input
            id="display-name"
            type="text"
            maxlength="50"
            placeholder="Display name"
        >


        <textarea
            id="bio"
            maxlength="500"
            placeholder="Bio">
        </textarea>


        <button onclick="saveProfile()">
            💾 Save Profile
        </button>


        <p id="status"></p>

    </section>

</main>


<script>

let currentUser = null;


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

    try {

        const response =
            await fetch("/api/me");


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.loggedIn ||
            !data.user
        ) {

            window.location.href =
                "/login.html";

            return;
        }


        currentUser =
            data.user;


        document.getElementById(
            "display-name"
        ).value =
            currentUser.display_name ||
            "";


        document.getElementById(
            "bio"
        ).value =
            currentUser.bio ||
            "";


        document.getElementById(
            "profile"
        ).innerHTML = `

            <div class="profile-card">

                <h2>
                    ${escapeHtml(
                        currentUser.display_name ||
                        currentUser.username
                    )}
                </h2>

                <p>
                    @${escapeHtml(
                        currentUser.username
                    )}
                </p>

                <p>
                    ${escapeHtml(
                        currentUser.bio ||
                        "No bio yet."
                    )}
                </p>

            </div>

        `;


    } catch (error) {

        console.error(
            "PROFILE ERROR:",
            error
        );

        document.getElementById(
            "profile"
        ).textContent =
            "❌ Could not load profile.";
    }
}


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile() {

    const display_name =
        document.getElementById(
            "display-name"
        ).value.trim();


    const bio =
        document.getElementById(
            "bio"
        ).value.trim();


    const status =
        document.getElementById(
            "status"
        );


    try {

        const response =
            await fetch(
                "/api/profile",
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        display_name,

                        bio

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not save profile."
            );

        }


        currentUser =
            data.user;


        status.textContent =
            "✅ Profile saved!";


        loadProfile();


    } catch (error) {

        console.error(
            "PROFILE SAVE ERROR:",
            error
        );


        status.textContent =
            "❌ " + error.message;
    }
}


/* =========================================
   LOGOUT
========================================= */

async function logout() {

    await fetch(
        "/api/logout",
        {
            method: "POST"
        }
    );


    window.location.href =
        "/login.html";
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;
}


/* =========================================
   START
========================================= */

loadProfile();

</script>

</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>ShrekBook Profile</title>

<link rel="stylesheet" href="/style.css">
```

</head>

<body>

<header class="topbar">

```
<div class="brand">
    🧌 ShrekBook
</div>

<nav>
    <a href="/">Home</a>
    <a href="/shrekchat.html">ShrekChat</a>
    <a href="/profile.html" id="my-profile-link">Profile</a>
    <button id="logout-button" type="button">Logout</button>
</nav>
```

</header>

<main class="profile-page">

```
<section class="profile-card">

    <div class="profile-avatar-area">

        <img
            id="profile-avatar"
            class="profile-avatar"
            src="/default-avatar.png"
            alt="Profile avatar"
        >

    </div>


    <div class="profile-information">

        <h1 id="profile-display-name">
            Loading...
        </h1>

        <div
            id="profile-username"
            class="profile-username"
        >
            @loading
        </div>

        <p
            id="profile-bio"
            class="profile-bio"
        >
            Loading profile...
        </p>

        <div
            id="profile-created"
            class="profile-created"
        ></div>

        <button
            id="edit-profile-button"
            type="button"
            style="display:none;"
        >
            ✏️ Edit Profile
        </button>

    </div>

</section>


<!-- =====================================================
     EDIT PROFILE
====================================================== -->

<section
    id="edit-profile-panel"
    class="profile-card edit-profile-panel"
    style="display:none;"
>

    <h2>✏️ Edit Your Profile</h2>

    <form id="edit-profile-form">

        <label for="edit-display-name">
            Display Name
        </label>

        <input
            id="edit-display-name"
            name="display_name"
            type="text"
            maxlength="100"
            autocomplete="name"
        >


        <label for="edit-username">
            Username
        </label>

        <input
            id="edit-username"
            name="username"
            type="text"
            maxlength="50"
            autocomplete="username"
        >


        <label for="edit-bio">
            Bio
        </label>

        <textarea
            id="edit-bio"
            name="bio"
            maxlength="500"
            rows="5"
        ></textarea>


        <label for="edit-avatar">
            Avatar URL
        </label>

        <input
            id="edit-avatar"
            name="avatar"
            type="url"
            maxlength="1000"
            placeholder="https://..."
        >


        <div class="edit-profile-buttons">

            <button
                id="save-profile-button"
                type="submit"
            >
                💾 Save Profile
            </button>

            <button
                id="cancel-edit-button"
                type="button"
            >
                Cancel
            </button>

        </div>


        <div
            id="profile-edit-message"
            class="profile-message"
        ></div>

    </form>

</section>


<!-- =====================================================
     POSTS
====================================================== -->

<section class="profile-section">

    <h2>📝 Posts</h2>

    <div id="profile-posts">

        <div class="loading">
            Loading posts...
        </div>

    </div>

</section>
```

</main>

<script src="/profile.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - ShrekBook</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >

</head>

<body>

<header>

    <div class="brand">

        <img
            class="avatar"
            src="/shrek.webp"
            alt="Shrek"
        >

        <h1>ShrekBook</h1>

    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/login.html">
            Login
        </a>

        <a href="/signup.html">
            Create Account
        </a>

    </nav>

</header>


<main class="container">

    <section
        class="profile"
        id="profile"
    >

        <p>
            Loading profile...
        </p>

    </section>


    <section>

        <h2>Posts</h2>

        <div id="profilePosts">

            Loading posts...

        </div>

    </section>

</main>


<script>

async function loadProfile() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const userId =
        params.get("id");

    const profile =
        document.getElementById(
            "profile"
        );

    const posts =
        document.getElementById(
            "profilePosts"
        );

    if (!userId) {

        profile.innerHTML =
            "<p>❌ No user ID provided.</p>";

        return;

    }

    try {

        const response =
            await fetch(
                `/api/users/${userId}`
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load profile"
            );

        }

        profile.innerHTML = `

            <img
                class="profile-avatar"
                src="${
                    data.avatar ||
                    "/shrek.webp"
                }"
                alt="Avatar"
            >

            <h2>
                ${escapeHTML(
                    data.display_name ||
                    data.username
                )}
            </h2>

            <p>
                @${escapeHTML(
                    data.username
                )}
            </p>

            <div class="stats">

                <span>
                    🧌 Ogres:
                    ${data.ogred ?? 0}
                </span>

                <span>
                    🐈 Cats:
                    ${data.cat ?? 0}
                </span>

                <span>
                    🍑 Gyatts:
                    ${data.gyatt ?? 0}
                </span>

            </div>

        `;

        if (
            data.posts &&
            data.posts.length
        ) {

            posts.innerHTML = "";

            data.posts.forEach(post => {

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "post";

                element.innerHTML = `

                    <p>
                        ${escapeHTML(
                            post.content
                        )}
                    </p>

                    <small>
                        ${new Date(
                            post.created_at
                        ).toLocaleString()}
                    </small>

                `;

                posts.appendChild(
                    element
                );

            });

        } else {

            posts.innerHTML =
                "<p>No posts yet.</p>";

        }

    } catch (error) {

        console.error(error);

        profile.innerHTML = `

            <p class="error">
                ❌ ${escapeHTML(
                    error.message
                )}
            </p>

        `;

    }

}


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


loadProfile();

</script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShrekBook Profile 🧌</title>

    <meta
        name="description"
        content="View a user profile on ShrekBook, a social network for sharing posts and connecting with friends.">

    <meta
        name="robots"
        content="index, follow">

    <link
        rel="stylesheet"
        href="/styles.css">

    <style>

        /* ==================================================
           PROFILE TITLE
        ================================================== */

        .profile-username-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0 12px;
        }

        .profile-username {
            margin: 0;
        }

        .equipped-title {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.06);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
        }

        .equipped-title-icon {
            font-size: 16px;
        }


        /* ==================================================
           PROFILE CARD
        ================================================== */

        .profile-card {
            text-align: center;
        }

        .profile-avatar {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0 auto 15px;
        }

        #profile-bio {
            max-width: 600px;
            margin: 10px auto 20px;
            color: #666;
        }
        /* ==================================================
        DISPLAYED ITEM
        ================================================== */

        .displayed-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            margin: 4px auto 12px;

            padding: 6px 12px;

            border-radius: 999px;

            background: rgba(0, 0, 0, 0.06);

            font-size: 14px;
            font-weight: 700;

            width: fit-content;
        }

        .displayed-item-icon {
            font-size: 22px;
            line-height: 1;
        }

        .displayed-item-name {
            line-height: 1.2;
        }

        /* ==================================================
           REACTIONS
        ================================================== */

        .profile-reactions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .profile-reactions button {
            border: none;
            border-radius: 12px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.15s ease;
        }

        .profile-reactions button:hover {
            transform: translateY(-2px);
        }


        /* ==================================================
           POSTS
        ================================================== */

        #profile-posts {
            margin-top: 20px;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {

            .profile-avatar {
                width: 105px;
                height: 105px;
            }

            .equipped-title {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<!-- ==================================================
     NAVBAR
================================================== -->

<header class="navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="logo">

            🧌 ShrekBook

        </a>


        <nav>

            <a href="/">
                Home
            </a>

            <a href="/profile.html">
                Profile
            </a>

        </nav>

    </div>

</header>



<!-- ==================================================
     MAIN
================================================== -->

<main class="container">


    <!-- ==================================================
         PROFILE
    ================================================== -->

    <section class="profile-card">

        <img
            id="profile-avatar"
            class="profile-avatar"
            src="/default-avatar.png"
            alt="Profile avatar"
            onerror="this.src='/default-avatar.png';">


        <h1 id="profile-display-name">
            Loading...
        </h1>


        <!-- USERNAME + TITLE -->

        <div class="profile-username-row">

            <p
                id="profile-username"
                class="profile-username">

                Loading...

            </p>

        </div>
        <div
            id="displayed-item"
            class="displayed-item"
            style="display:none;">

            <span
                id="displayed-item-icon"
                class="displayed-item-icon">
            </span>

            <span
                id="displayed-item-name"
                class="displayed-item-name">
            </span>

        </div>


        <p id="profile-bio">
        </p>


        <!-- ==================================================
             REACTIONS
        ================================================== -->

        <div class="profile-reactions">

            <button
                onclick="giveReaction('gyatt')">

                🍑 Gyatt

                <span id="gyatt-count">
                    0
                </span>

            </button>


            <button
                onclick="giveReaction('cat')">

                🐱 Cat

                <span id="cat-count">
                    0
                </span>

            </button>


            <button
                onclick="giveReaction('ogred')">

                🧌 Ogred

                <span id="ogred-count">
                    0
                </span>

            </button>

        </div>


        <!-- EDIT -->

        <button
            id="edit-button"
            onclick="showEditProfile()"
            style="display:none;">

            ✏️ Edit Profile

        </button>

    </section>



    <!-- ==================================================
         EDIT PROFILE
    ================================================== -->

    <section
        id="edit-profile"
        class="auth-box"
        style="display:none;">

        <h2>
            ✏️ Edit Profile
        </h2>


        <label for="edit-display-name">
            Display name
        </label>

        <input
            id="edit-display-name"
            type="text"
            maxlength="50">


        <label for="edit-bio">
            Bio
        </label>

        <textarea
            id="edit-bio"
            maxlength="500"
            placeholder="Tell people about yourself..."></textarea>


        <h3>
            🖼️ Change Avatar
        </h3>


        <input
            id="avatar-input"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif">


        <button
            onclick="uploadAvatar()">

            📸 Upload Avatar

        </button>


        <button
            onclick="saveProfile()">

            💾 Save Profile

        </button>


        <button
            class="secondary-button"
            onclick="hideEditProfile()">

            Cancel

        </button>


        <p id="profile-status">
        </p>

    </section>



    <!-- ==================================================
         POSTS
    ================================================== -->

    <section>

        <h2>
            Posts
        </h2>


        <div id="profile-posts">

            Loading posts...

        </div>

    </section>

</main>



<script>


let profileUser = null;



// ==================================================
// GET PROFILE ID
// ==================================================

function getProfileId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}



// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}



// ==================================================
// DISPLAY EQUIPPED TITLE
// ==================================================

function renderEquippedTitle() {

    const usernameElement =
        document.getElementById(
            "profile-username"
        );


    if (!usernameElement) {
        return;
    }


    /*
     * Clear previous title.
     */

    const oldTitle =
        document.getElementById(
            "equipped-title-display"
        );

    if (oldTitle) {
        oldTitle.remove();
    }


    const title =
        profileUser &&
        profileUser.equippedTitle;


    /*
     * No title equipped.
     */

    if (!title) {
        return;
    }


    const titleElement =
        document.createElement(
            "span"
        );


    titleElement.id =
        "equipped-title-display";

    titleElement.className =
        "equipped-title";


    const icon =
        title.icon ||
        "👑";


    const name =
        title.name ||
        "Unknown Title";


    titleElement.innerHTML = `

        <span
            class="equipped-title-icon">

            ${escapeHtml(icon)}

        </span>

        <span>

            ${escapeHtml(name)}

        </span>

    `;


    usernameElement.appendChild(
        document.createTextNode(" ")
    );

    usernameElement.appendChild(
        titleElement
    );

}

// ==================================================
// DISPLAY MULTIPLE ITEMS
// ==================================================

function renderDisplayedItem() {

    const container =
        document.getElementById(
            "displayed-items"
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    const items =
        profileUser &&
        Array.isArray(
            profileUser.displayedItems
        )
            ? profileUser.displayedItems
            : [];


    // ==========================================
    // NO ITEMS
    // ==========================================

    if (
        items.length === 0
    ) {

        return;

    }


    // ==========================================
    // DISPLAY ITEMS
    // ==========================================

    items.forEach(
        item => {

            const itemElement =
                document.createElement(
                    "div"
                );


            itemElement.className =
                "displayed-item";


            const iconElement =
                document.createElement(
                    "span"
                );


            iconElement.className =
                "displayed-item-icon";


            iconElement.textContent =
                item.icon ||
                "🎁";


            const nameElement =
                document.createElement(
                    "span"
                );


            nameElement.className =
                "displayed-item-name";


            nameElement.textContent =
                item.name ||
                "Item";


            itemElement.appendChild(
                iconElement
            );


            itemElement.appendChild(
                nameElement
            );


            container.appendChild(
                itemElement
            );

        }
    );

}

// ==================================================
// LOAD PROFILE
// ==================================================

async function loadProfile() {

    const id =
        getProfileId();


    const url =
        id
            ? `/api/users/${encodeURIComponent(id)}`
            : "/api/me";


    try {

        const response =
            await fetch(
                url,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load profile."
            );

        }


        profileUser =
            id
                ? data
                : data.user;


        if (!profileUser) {

            throw new Error(
                "Profile not found."
            );

        }



        // ==================================================
        // DISPLAY NAME
        // ==================================================

        document.getElementById(
            "profile-display-name"
        ).textContent =
            profileUser.display_name ||
            profileUser.username ||
            "User";



        // ==================================================
        // USERNAME
        // ==================================================

        document.getElementById(
            "profile-username"
        ).textContent =
            "@" +
            (
                profileUser.username ||
                "user"
            );



        // ==================================================
        // TITLE
        // ==================================================

        renderEquippedTitle();
        renderDisplayedItem();


        // ==================================================
        // BIO
        // ==================================================

        document.getElementById(
            "profile-bio"
        ).textContent =
            profileUser.bio ||
            "No bio yet.";



        // ==================================================
        // AVATAR
        // ==================================================

        document.getElementById(
            "profile-avatar"
        ).src =
            profileUser.avatar ||
            "/default-avatar.png";



        // ==================================================
        // REACTIONS
        // ==================================================

        document.getElementById(
            "gyatt-count"
        ).textContent =
            profileUser.gyatt || 0;


        document.getElementById(
            "cat-count"
        ).textContent =
            profileUser.cat || 0;


        document.getElementById(
            "ogred-count"
        ).textContent =
            profileUser.ogred || 0;



        // ==================================================
        // CHECK IF THIS IS OUR PROFILE
        // ==================================================

        const meResponse =
            await fetch(
                "/api/me",
                {
                    credentials: "include"
                }
            );


        const me =
            await meResponse.json();


        if (
            me.loggedIn &&
            me.user &&
            me.user.id === profileUser.id
        ) {

            document.getElementById(
                "edit-button"
            ).style.display =
                "inline-block";

        }



        // ==================================================
        // POSTS
        // ==================================================

        loadProfilePosts(
            profileUser.posts || []
        );


    } catch (error) {

        console.error(
            "PROFILE LOAD ERROR:",
            error
        );


        document.getElementById(
            "profile-display-name"
        ).textContent =
            "❌ " +
            error.message;

    }

}



// ==================================================
// REACTIONS
// ==================================================

async function giveReaction(type) {

    if (!profileUser) {
        return;
    }


    const id =
        profileUser.id;


    try {

        const response =
            await fetch(
                `/api/users/${encodeURIComponent(id)}/${type}`,
                {
                    method: "POST",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Could not give reaction."
            );

            return;

        }



        if (type === "gyatt") {

            document.getElementById(
                "gyatt-count"
            ).textContent =
                data.gyatt;

        }


        if (type === "cat") {

            document.getElementById(
                "cat-count"
            ).textContent =
                data.cat;

        }


        if (type === "ogred") {

            document.getElementById(
                "ogred-count"
            ).textContent =
                data.ogred;

        }


    } catch (error) {

        console.error(
            "REACTION ERROR:",
            error
        );


        alert(
            "Could not give reaction."
        );

    }

}



// ==================================================
// SHOW EDIT
// ==================================================

function showEditProfile() {

    if (!profileUser) {
        return;
    }


    document.getElementById(
        "edit-profile"
    ).style.display =
        "block";


    document.getElementById(
        "edit-display-name"
    ).value =
        profileUser.display_name ||
        profileUser.username ||
        "";


    document.getElementById(
        "edit-bio"
    ).value =
        profileUser.bio ||
        "";

}



// ==================================================
// HIDE EDIT
// ==================================================

function hideEditProfile() {

    document.getElementById(
        "edit-profile"
    ).style.display =
        "none";

}



// ==================================================
// SAVE PROFILE
// ==================================================

async function saveProfile() {

    const display_name =
        document.getElementById(
            "edit-display-name"
        ).value.trim();


    const bio =
        document.getElementById(
            "edit-bio"
        ).value.trim();


    const status =
        document.getElementById(
            "profile-status"
        );


    if (!display_name) {

        status.textContent =
            "❌ Display name cannot be empty.";

        return;

    }


    status.textContent =
        "Saving...";


    try {

        const response =
            await fetch(
                "/api/profile",
                {
                    method: "PUT",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        display_name,
                        bio
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not save profile."
            );

        }


        profileUser = {
            ...profileUser,
            ...data.user
        };


        document.getElementById(
            "profile-display-name"
        ).textContent =
            profileUser.display_name;


        document.getElementById(
            "profile-bio"
        ).textContent =
            profileUser.bio ||
            "No bio yet.";


        renderEquippedTitle();


        status.textContent =
            "✅ Profile saved!";


        setTimeout(
            hideEditProfile,
            800
        );


    } catch (error) {

        console.error(
            "PROFILE SAVE ERROR:",
            error
        );


        status.textContent =
            "❌ " +
            error.message;

    }

}



// ==================================================
// UPLOAD AVATAR
// ==================================================

async function uploadAvatar() {

    const input =
        document.getElementById(
            "avatar-input"
        );


    const status =
        document.getElementById(
            "profile-status"
        );


    const file =
        input.files[0];


    if (!file) {

        status.textContent =
            "❌ Choose an image first.";

        return;

    }


    if (
        file.size >
        5 * 1024 * 1024
    ) {

        status.textContent =
            "❌ Image must be under 5MB.";

        return;

    }


    status.textContent =
        "Uploading avatar...";


    const reader =
        new FileReader();


    reader.onload =
        async function () {

            try {

                const base64 =
                    reader.result
                        .split(",")[1];


                const response =
                    await fetch(
                        "/api/profile/avatar",
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                fileName:
                                    file.name,

                                fileType:
                                    file.type,

                                fileData:
                                    base64

                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Avatar upload failed."
                    );

                }


                profileUser.avatar =
                    data.avatar;


                document.getElementById(
                    "profile-avatar"
                ).src =
                    data.avatar;


                status.textContent =
                    "✅ Avatar updated!";


                input.value = "";


            } catch (error) {

                console.error(
                    "AVATAR ERROR:",
                    error
                );


                status.textContent =
                    "❌ " +
                    error.message;

            }

        };


    reader.readAsDataURL(file);

}



// ==================================================
// PROFILE POSTS
// ==================================================

function loadProfilePosts(posts) {

    const container =
        document.getElementById(
            "profile-posts"
        );


    if (!posts.length) {

        container.innerHTML =
            "<p>No posts yet.</p>";

        return;

    }


    container.innerHTML =
        posts.map(
            post => `

                <article
                    class="post">

                    <div
                        class="post-header">

                        <strong>

                            ${escapeHtml(
                                profileUser.display_name ||
                                profileUser.username
                            )}

                        </strong>

                    </div>


                    <div
                        class="post-content">

                        ${escapeHtml(
                            post.content || ""
                        )}

                    </div>

                </article>

            `
        ).join("");

}



// ==================================================
// START
// ==================================================

loadProfile();

</script>

</body>

</html>

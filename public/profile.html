<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile - ShrekBook 🧌</title>

    <link
        rel="stylesheet"
        href="/styles.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        🧌 ShrekBook
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/profile.html">
            Profile
        </a>

        <button onclick="logout()">
            Logout
        </button>

    </nav>

</header>


<main class="container">

    <section class="profile-card">

        <h1>
            My Profile 👤
        </h1>


        <!-- ===================== -->
        <!-- AVATAR -->
        <!-- ===================== -->

        <div class="avatar-editor">

            <img
                id="avatar-preview"
                class="profile-avatar"
                src="/default-avatar.png"
                alt="Profile avatar">

            <label>
                Avatar URL
            </label>

            <input
                id="avatar"
                type="url"
                placeholder="https://example.com/avatar.png">

        </div>


        <!-- ===================== -->
        <!-- DISPLAY NAME -->
        <!-- ===================== -->

        <label>
            Display Name
        </label>

        <input
            id="display-name"
            type="text"
            maxlength="50"
            placeholder="Your display name">


        <!-- ===================== -->
        <!-- USERNAME -->
        <!-- ===================== -->

        <label>
            Username
        </label>

        <input
            id="username"
            type="text"
            disabled>


        <!-- ===================== -->
        <!-- BIO -->
        <!-- ===================== -->

        <label>
            Bio
        </label>

        <textarea
            id="bio"
            maxlength="500"
            placeholder="Tell everyone about yourself...">
        </textarea>


        <!-- ===================== -->
        <!-- SHREK STATS -->
        <!-- ===================== -->

        <h2>
            ShrekBook Stats 🧌
        </h2>


        <label>
            🧌 Gyatt
        </label>

        <input
            id="gyatt"
            type="number"
            min="0"
            value="0">


        <label>
            🐱 Cat
        </label>

        <input
            id="cat"
            type="number"
            min="0"
            value="0">


        <label>
            👹 Ogre
        </label>

        <input
            id="ogres"
            type="number"
            min="0"
            value="0">


        <!-- ===================== -->
        <!-- SAVE -->
        <!-- ===================== -->

        <button
            class="save-button"
            onclick="saveProfile()">

            💾 Save Profile

        </button>


        <p id="status"></p>

    </section>

</main>


<script>

/* =========================================
   ESCAPE
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;
}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile() {

    try {

        const response =
            await fetch("/api/me");

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load profile."
            );
        }

        const user =
            data.user;


        document.getElementById(
            "avatar"
        ).value =
            user.avatar || "";


        document.getElementById(
            "avatar-preview"
        ).src =
            user.avatar ||
            "/default-avatar.png";


        document.getElementById(
            "display-name"
        ).value =
            user.display_name || "";


        document.getElementById(
            "username"
        ).value =
            user.username || "";


        document.getElementById(
            "bio"
        ).value =
            user.bio || "";


        document.getElementById(
            "gyatt"
        ).value =
            user.gyatt || 0;


        document.getElementById(
            "cat"
        ).value =
            user.cat || 0;


        document.getElementById(
            "ogres"
        ).value =
            user.ogres || 0;


    } catch (error) {

        console.error(
            "PROFILE LOAD ERROR:",
            error
        );

        document.getElementById(
            "status"
        ).textContent =
            "❌ " + error.message;
    }
}


/* =========================================
   AVATAR PREVIEW
========================================= */

document
    .getElementById("avatar")
    .addEventListener(
        "input",
        function () {

            const url =
                this.value.trim();

            document.getElementById(
                "avatar-preview"
            ).src =
                url ||
                "/default-avatar.png";
        }
    );


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile() {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        "Saving...";


    try {

        const response =
            await fetch(
                "/api/profile",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        avatar:
                            document.getElementById(
                                "avatar"
                            ).value.trim(),

                        display_name:
                            document.getElementById(
                                "display-name"
                            ).value.trim(),

                        bio:
                            document.getElementById(
                                "bio"
                            ).value.trim(),

                        gyatt:
                            Number(
                                document.getElementById(
                                    "gyatt"
                                ).value
                            ) || 0,

                        cat:
                            Number(
                                document.getElementById(
                                    "cat"
                                ).value
                            ) || 0,

                        ogres:
                            Number(
                                document.getElementById(
                                    "ogres"
                                ).value
                            ) || 0
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not save profile."
            );
        }


        status.textContent =
            "✅ Profile saved!";


        document.getElementById(
            "avatar-preview"
        ).src =
            data.user.avatar ||
            "/default-avatar.png";


    } catch (error) {

        console.error(
            "PROFILE SAVE ERROR:",
            error
        );

        status.textContent =
            "❌ " + error.message;
    }
}


/* =========================================
   LOGOUT
========================================= */

async function logout() {

    await fetch(
        "/api/logout",
        {
            method: "POST"
        }
    );

    location.href = "/";
}


/* =========================================
   START
========================================= */

loadProfile();

</script>

</body>
</html>

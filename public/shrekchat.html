<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekChat — ShrekBook</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

    <nav class="shrek-navbar">

        <a
            href="/"
            class="shrek-logo"
        >
            <span>🧌</span>
            ShrekBook
        </a>

        <div class="nav-actions">

            <a
                href="/"
                class="nav-button"
            >
                🏠 Home
            </a>

            <button
                class="nav-button"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>

    </nav>


    <main class="chat-page">

        <!-- ROOMS -->

        <section class="chat-rooms">

            <div class="chat-rooms-header">
                💬 ShrekChat
            </div>

            <div id="chat-rooms-list">

                <div class="loading">
                    Loading chats...
                </div>

            </div>

        </section>


        <!-- CHAT -->

        <section class="chat-window">

            <div
                id="chat-header"
                class="chat-header"
            >
                Select a chat
            </div>


            <div
                id="chat-messages"
                class="chat-messages"
            >

                <div class="empty">
                    🧌 Pick a conversation.
                </div>

            </div>


            <form
                id="chat-form"
                class="chat-input-area"
            >

                <input
                    id="chat-input"
                    class="chat-input"
                    type="text"
                    placeholder="Say something..."
                    autocomplete="off"
                >

                <button
                    class="primary-button"
                    type="submit"
                >
                    Send
                </button>

            </form>

        </section>

    </main>


    <script src="/chat.js"></script>

</body>

</html>

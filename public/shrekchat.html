
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>ShrekChat 🧌</title>

<link
    rel="stylesheet"
    href="/styles.css">

</head>


<body>

<header class="navbar">

<div class="navbar-inner">

<a
    href="/"
    class="logo">

    🧌 ShrekBook

</a>

<nav>

<a href="/">
    Home
</a>

</nav>

</div>

</header>


<main class="container">

<h1>
    🧌 ShrekChat
</h1>

<p>
    The swamp's finest chat network.
</p>


<!-- ==================================================
CREATE ROOM
================================================== -->

<section class="create-post">

<h2>
    Create a Room
</h2>


<input
    id="room-name"
    type="text"
    maxlength="50"
    placeholder="Room name">


<label>

<input
    id="private-room"
    type="checkbox">

🔒 Private room

</label>


<button
    onclick="createRoom()">

    ➕ Create Room

</button>


<p id="room-status"></p>

</section>


<!-- ==================================================
ROOMS
================================================== -->

<section>

<h2>
    Rooms
</h2>


<button
    onclick="loadRooms()">

    🔄 Refresh

</button>


<div id="rooms">

    Loading rooms...

</div>

</section>


<!-- ==================================================
CHAT
================================================== -->

<section
    id="chat-section"
    style="display:none;">

<h2 id="chat-title">
    Chat
</h2>


<button
    onclick="leaveRoom()">

    🚪 Leave Room

</button>


<button
    id="invite-button"
    onclick="toggleInvitePanel()"
    style="display:none;">

    👥 Invite People

</button>


<button
    id="delete-room-button"
    onclick="deleteRoom()"
    style="display:none;">

    🗑️ Delete Room

</button>


<!-- ==================================================
INVITES
================================================== -->

<div
    id="invite-panel"
    style="
        display:none;
        margin-top:20px;
    ">

<h3>
    👥 Invite People
</h3>


<div id="invite-users">

    Loading users...

</div>

</div>


<!-- ==================================================
MESSAGES
================================================== -->

<div
    id="messages"
    style="
        margin-top:20px;
        min-height:300px;
        max-height:500px;
        overflow-y:auto;
    ">

</div>


<!-- ==================================================
SEND MESSAGE
================================================== -->

<div
    style="
        display:flex;
        gap:10px;
        margin-top:15px;
    ">

<input
    id="message-input"
    type="text"
    maxlength="1000"
    placeholder="Say something...">


<button
    onclick="sendMessage()">

    Send

</button>

</div>

</section>

</main>


<script>

let currentRoom = null;

let currentUserId = null;

let messageTimer = null;


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


// ==================================================
// CURRENT USER
// ==================================================

async function getCurrentUser() {

    try {

        const response =
            await fetch("/api/me");

        const data =
            await response.json();


        if (
            response.ok &&
            data.loggedIn &&
            data.user
        ) {

            currentUserId =
                data.user.id;

        } else {

            window.location.href = "/";

        }

    } catch {

        window.location.href = "/";

    }

}


// ==================================================
// LOAD ROOMS
// ==================================================

async function loadRooms() {

    const container =
        document.getElementById(
            "rooms"
        );


    try {

        const response =
            await fetch(
                "/api/chat/rooms"
            );


        const rooms =
            await response.json();


        if (!response.ok) {

            throw new Error(
                rooms.error ||
                "Could not load rooms."
            );

        }


        if (!rooms.length) {

            container.innerHTML =
                "<p>No rooms yet. Create one! 🧌</p>";

            return;

        }


        container.innerHTML =
            rooms.map(room => {

                const creator =
                    room.created_by ===
                    currentUserId;


                return `

<div class="post">

<h3>

${
    room.is_private
        ? "🔒"
        : "🟢"
}

${escapeHtml(room.name)}

</h3>


<p>

${
    room.is_private
        ? "Private room"
        : "Public room"
}

</p>


<button
    onclick="joinRoom('${room.id}')">

    💬 Enter

</button>


${
    creator
        ? `

<button
    onclick="deleteRoomById('${room.id}')">

    🗑️ Delete

</button>

`
        : ""
}

</div>

`;

            }).join("");


    } catch (error) {

        container.innerHTML =
            `<p>❌ ${escapeHtml(
                error.message
            )}</p>`;

    }

}


// ==================================================
// CREATE ROOM
// ==================================================

async function createRoom() {

    const nameInput =
        document.getElementById(
            "room-name"
        );


    const privateInput =
        document.getElementById(
            "private-room"
        );


    const status =
        document.getElementById(
            "room-status"
        );


    const name =
        nameInput.value.trim();


    if (!name) {

        status.textContent =
            "❌ Enter a room name.";

        return;

    }


    status.textContent =
        "Creating room...";


    try {

        const response =
            await fetch(
                "/api/chat/rooms",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        name,

                        is_private:
                            privateInput.checked

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not create room."
            );

        }


        nameInput.value = "";

        privateInput.checked =
            false;


        status.textContent =
            "✅ Room created!";


        await loadRooms();

        openRoom(data);


    } catch (error) {

        status.textContent =
            "❌ " +
            error.message;

    }

}


// ==================================================
// JOIN ROOM
// ==================================================

async function joinRoom(roomId) {

    try {

        const response =
            await fetch(
                `/api/chat/rooms/${roomId}/join`,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not enter room."
            );

        }


        const roomsResponse =
            await fetch(
                "/api/chat/rooms"
            );


        const rooms =
            await roomsResponse.json();


        const room =
            rooms.find(
                r =>
                    r.id === roomId
            );


        if (room) {

            openRoom(room);

        }


    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ==================================================
// OPEN ROOM
// ==================================================

function openRoom(room) {

    currentRoom =
        room;


    document.getElementById(
        "chat-section"
    ).style.display =
        "block";


    document.getElementById(
        "chat-title"
    ).textContent =
        `${
            room.is_private
                ? "🔒"
                : "🟢"
        } ${room.name}`;


    const creator =
        room.created_by ===
        currentUserId;


    document.getElementById(
        "invite-button"
    ).style.display =
        creator
            ? "inline-block"
            : "none";


    document.getElementById(
        "delete-room-button"
    ).style.display =
        creator
            ? "inline-block"
            : "none";


    document.getElementById(
        "invite-panel"
    ).style.display =
        "none";


    loadMessages();


    if (messageTimer) {

        clearInterval(
            messageTimer
        );

    }


    messageTimer =
        setInterval(
            loadMessages,
            2000
        );

}


// ==================================================
// LEAVE
// ==================================================

async function leaveRoom() {

    if (!currentRoom)
        return;


    try {

        await fetch(
            `/api/chat/rooms/${currentRoom.id}/leave`,
            {
                method: "POST"
            }
        );

    } catch {}


    currentRoom = null;


    if (messageTimer) {

        clearInterval(
            messageTimer
        );

        messageTimer = null;

    }


    document.getElementById(
        "chat-section"
    ).style.display =
        "none";


    loadRooms();

}


// ==================================================
// DELETE
// ==================================================

async function deleteRoom() {

    if (!currentRoom)
        return;


    await deleteRoomById(
        currentRoom.id
    );

}


async function deleteRoomById(roomId) {

    if (
        !confirm(
            "Delete this room permanently?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/chat/rooms/${roomId}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not delete room."
            );

        }


        if (
            currentRoom &&
            currentRoom.id ===
            roomId
        ) {

            currentRoom = null;


            if (messageTimer) {

                clearInterval(
                    messageTimer
                );

                messageTimer = null;

            }


            document.getElementById(
                "chat-section"
            ).style.display =
                "none";

        }


        loadRooms();


    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ==================================================
// INVITE PANEL
// ==================================================

function toggleInvitePanel() {

    const panel =
        document.getElementById(
            "invite-panel"
        );


    if (
        panel.style.display ===
        "none"
    ) {

        panel.style.display =
            "block";

        loadInviteUsers();

    } else {

        panel.style.display =
            "none";

    }

}


// ==================================================
// LOAD INVITE USERS
// ==================================================

async function loadInviteUsers() {

    const container =
        document.getElementById(
            "invite-users"
        );


    try {

        const response =
            await fetch(
                `/api/chat/rooms/${currentRoom.id}/invite-users`
            );


        const users =
            await response.json();


        if (!response.ok) {

            throw new Error(
                users.error ||
                "Could not load users."
            );

        }


        if (!users.length) {

            container.innerHTML =
                "<p>Everyone is already here! 🧌</p>";

            return;

        }


        container.innerHTML =
            users.map(user => `

<div
    style="
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:10px;
    ">


<img
    src="${
        escapeHtml(
            user.avatar ||
            "/default-avatar.png"
        )
    }"
    style="
        width:40px;
        height:40px;
        border-radius:50%;
        object-fit:cover;
    ">


<div>

<strong>

${escapeHtml(
    user.display_name ||
    user.username
)}

</strong>


<div>

@${escapeHtml(
    user.username
)}

</div>

</div>


<button
    onclick="inviteUser('${user.id}')">

    ➕ Invite

</button>


</div>

`).join("");


    } catch (error) {

        container.innerHTML =
            `<p>❌ ${escapeHtml(
                error.message
            )}</p>`;

    }

}


// ==================================================
// INVITE USER
// ==================================================

async function inviteUser(userId) {

    if (!currentRoom)
        return;


    try {

        const response =
            await fetch(
                `/api/chat/rooms/${currentRoom.id}/invite`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        user_id:
                            userId

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not invite user."
            );

        }


        alert(
            "✅ User invited!"
        );


        loadInviteUsers();


        loadRooms();


    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ==================================================
// LOAD MESSAGES
// ==================================================

async function loadMessages() {

    if (!currentRoom)
        return;


    const container =
        document.getElementById(
            "messages"
        );


    try {

        const response =
            await fetch(
                `/api/chat/rooms/${currentRoom.id}/messages`
            );


        const messages =
            await response.json();


        if (!response.ok) {

            throw new Error(
                messages.error ||
                "Could not load messages."
            );

        }


        container.innerHTML =
            messages.map(message => `

<div
    style="
        display:flex;
        gap:10px;
        margin-bottom:15px;
    ">


<img
    src="${
        escapeHtml(
            message.avatar ||
            "/default-avatar.png"
        )
    }"
    style="
        width:45px;
        height:45px;
        border-radius:50%;
        object-fit:cover;
    ">


<div>

<strong>

${escapeHtml(
    message.display_name ||
    message.username ||
    "User"
)}

</strong>


<div
    style="
        font-size:12px;
        opacity:.7;
    ">

@${escapeHtml(
    message.username ||
    "user"
)}

</div>


<p>

${escapeHtml(
    message.content
)}

</p>


<div
    style="
        font-size:12px;
        opacity:.7;
    ">

🐱 ${message.cat || 0}

&nbsp;

🍑 ${message.gyatt || 0}

&nbsp;

🧌 ${message.ogred || 0}

</div>


</div>

</div>

`).join("");


        container.scrollTop =
            container.scrollHeight;


    } catch (error) {

        console.error(
            "MESSAGE ERROR:",
            error
        );

    }

}


// ==================================================
// SEND MESSAGE
// ==================================================

async function sendMessage() {

    if (!currentRoom)
        return;


    const input =
        document.getElementById(
            "message-input"
        );


    const content =
        input.value.trim();


    if (!content)
        return;


    try {

        const response =
            await fetch(
                `/api/chat/rooms/${currentRoom.id}/messages`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        content
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not send message."
            );

        }


        input.value = "";

        loadMessages();


    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ==================================================
// ENTER KEY
// ==================================================

document
    .getElementById(
        "message-input"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                sendMessage();

            }

        }
    );


// ==================================================
// START
// ==================================================

(async function () {

    await getCurrentUser();

    await loadRooms();

})();

</script>

</body>

</html>

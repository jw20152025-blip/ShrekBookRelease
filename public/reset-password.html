
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - ShrekBook 🧌</title>

    <link rel="stylesheet" href="/styles.css">

    <!-- Supabase browser library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="navbar">
    <div class="navbar-inner">

        <a href="/" class="logo">
            🧌 ShrekBook
        </a>

        <nav>
            <a href="/">Home</a>
            <a href="/login.html">Login</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="auth-section">

        <div class="auth-box">

            <h1>Reset Password 🔐</h1>

            <p>
                Enter your new ShrekBook password below.
            </p>

            <input
                id="password"
                type="password"
                placeholder="New password"
                autocomplete="new-password"
            >

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm new password"
                autocomplete="new-password"
            >

            <button onclick="resetPassword()">
                🔐 Change Password
            </button>

            <p id="status"></p>

        </div>

    </section>

</main>


<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

/*
   IMPORTANT:
   Use your PUBLIC/ANON Supabase key here.

   DO NOT put your service_role key in this page.
*/

const SUPABASE_URL =
    "https://mhtzgpetspkfikcewxho.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_rRgIoBglSf76bTtU5OnE1g_rvcDGa8s";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==================================================
   CHECK RECOVERY SESSION
================================================== */

async function checkRecoverySession() {

    const status =
        document.getElementById("status");


    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "SESSION ERROR:",
            error
        );

        status.textContent =
            "❌ Unable to verify the password reset link.";

        return false;
    }


    if (!data.session) {

        status.textContent =
            "❌ This password reset link is invalid or has expired.";

        return false;
    }


    return true;
}


/* ==================================================
   RESET PASSWORD
================================================== */

async function resetPassword() {

    const password =
        document.getElementById("password")
            .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
            .value;

    const status =
        document.getElementById("status");


    if (!password || !confirmPassword) {

        status.textContent =
            "❌ Please enter your new password.";

        return;
    }


    if (password !== confirmPassword) {

        status.textContent =
            "❌ Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        status.textContent =
            "❌ Password must be at least 6 characters.";

        return;
    }


    status.textContent =
        "Changing password...";


    try {

        const {
            error
        } =
            await supabaseClient.auth.updateUser({

                password:
                    password

            });


        if (error) {

            throw error;

        }


        status.textContent =
            "✅ Password changed successfully!";


        setTimeout(() => {

            window.location.href =
                "/login.html";

        }, 1500);


    } catch (error) {

        console.error(
            "PASSWORD RESET ERROR:",
            error
        );

        status.textContent =
            "❌ " +
            (
                error.message ||
                "Failed to change password."
            );

    }

}


/* ==================================================
   START
================================================== */

checkRecoverySession();

</script>

</body>
</html>

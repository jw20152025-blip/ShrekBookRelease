<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sell History - ShrekBook</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            background: #eeeeee;

            font-family: Arial, Helvetica, sans-serif;

            color: #222;
        }

        body {
            min-height: 100vh;
        }

        * {
            box-sizing: border-box;
        }


        /* HEADER */

        .topbar {

            width: 100%;

            background: white;

            border-bottom: 1px solid #cccccc;

            padding: 18px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }

        .logo {

            font-size: 24px;

            font-weight: bold;

        }

        .back {

            display: inline-block;

            padding: 10px 16px;

            background: #eeeeee;

            border: 1px solid #cccccc;

            border-radius: 8px;

            text-decoration: none;

            color: #222;

            font-weight: bold;

        }

        .back:hover {

            background: #dddddd;

        }


        /* MAIN */

        .container {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding: 30px 20px 60px;

        }


        h1 {

            margin: 0;

            font-size: 32px;

        }

        .subtitle {

            margin-top: 8px;

            color: #666;

        }


        /* STATS */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 25px;

            margin-bottom: 25px;

        }

        .stat {

            background: white;

            border: 1px solid #dddddd;

            border-radius: 12px;

            padding: 20px;

        }

        .stat-title {

            font-size: 14px;

            color: #777;

        }

        .stat-number {

            margin-top: 8px;

            font-size: 25px;

            font-weight: bold;

        }


        /* HISTORY */

        .history {

            width: 100%;

            background: white;

            border: 1px solid #dddddd;

            border-radius: 12px;

            overflow: hidden;

        }


        .message {

            padding: 50px 20px;

            text-align: center;

            color: #666;

        }


        .sale {

            width: 100%;

            padding: 20px;

            border-bottom: 1px solid #eeeeee;

        }

        .sale:last-child {

            border-bottom: none;

        }


        .sale-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .item-name {

            font-size: 18px;

            font-weight: bold;

        }


        .earned {

            font-size: 18px;

            font-weight: bold;

        }


        .details {

            display: flex;

            flex-wrap: wrap;

            gap: 20px;

            margin-top: 10px;

            color: #666;

            font-size: 14px;

        }


        .error {

            color: #b00020;

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .stats {

                grid-template-columns: 1fr;

            }

            .sale-top {

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


    <header class="topbar">

        <div class="logo">
            🥪 ShrekBook
        </div>

        <a
            class="back"
            href="/shop.html"
        >
            ← Shop
        </a>

    </header>


    <main class="container">


        <h1>
            💰 Sell History
        </h1>

        <p class="subtitle">
            Your marketplace sales.
        </p>


        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    Total Sales
                </div>

                <div
                    class="stat-number"
                    id="total-sales"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Total Earned
                </div>

                <div
                    class="stat-number"
                    id="total-earned"
                >
                    0 🪙
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Tax Paid
                </div>

                <div
                    class="stat-number"
                    id="total-tax"
                >
                    0 🪙
                </div>

            </div>

        </div>


        <div class="history">

            <div
                class="message"
                id="loading"
            >
                Loading sell history...
            </div>


            <div
                class="message"
                id="empty"
                style="display:none;"
            >
                You haven't sold anything yet. 🫩
            </div>


            <div
                class="message error"
                id="error"
                style="display:none;"
            >
            </div>


            <div id="sales-list"></div>

        </div>


    </main>


    <script>

        "use strict";


        async function loadSellHistory() {

            const loading =
                document.getElementById(
                    "loading"
                );

            const empty =
                document.getElementById(
                    "empty"
                );

            const error =
                document.getElementById(
                    "error"
                );

            const list =
                document.getElementById(
                    "sales-list"
                );


            try {

                const response =
                    await fetch(
                        "/api/shop/sell-history",
                        {
                            method: "GET",

                            credentials: "include",

                            cache: "no-store"
                        }
                    );


                let data;

                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        "Server returned invalid JSON."
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Failed to load sell history."
                    );

                }


                const sales =
                    Array.isArray(
                        data.sales
                    )
                        ? data.sales
                        : [];


                loading.style.display =
                    "none";


                document.getElementById(
                    "total-sales"
                ).textContent =
                    sales.length
                        .toLocaleString();


                let earned = 0;

                let tax = 0;


                sales.forEach(
                    sale => {

                        earned +=
                            Number(
                                sale.seller_amount || 0
                            );

                        tax +=
                            Number(
                                sale.tax || 0
                            );

                    }
                );


                document.getElementById(
                    "total-earned"
                ).textContent =
                    earned.toLocaleString()
                    + " 🪙";


                document.getElementById(
                    "total-tax"
                ).textContent =
                    tax.toLocaleString()
                    + " 🪙";


                if (sales.length === 0) {

                    empty.style.display =
                        "block";

                    return;

                }


                list.innerHTML =
                    sales.map(
                        sale => {

                            const item =
                                sale.shop_items;

                            const buyer =
                                sale.profiles;


                            const itemName =
                                item?.name ||
                                `Item #${sale.item_id}`;


                            const buyerName =
                                buyer?.display_name ||
                                buyer?.username ||
                                "Unknown user";


                            const date =
                                sale.created_at
                                    ? new Date(
                                        sale.created_at
                                    ).toLocaleString()
                                    : "Unknown date";


                            return `
                                <div class="sale">

                                    <div class="sale-top">

                                        <div>

                                            <div class="item-name">
                                                🛒
                                                ${escapeHtml(itemName)}
                                            </div>

                                        </div>

                                        <div class="earned">
                                            +${Number(
                                                sale.seller_amount || 0
                                            ).toLocaleString()} 🪙
                                        </div>

                                    </div>


                                    <div class="details">

                                        <span>
                                            Buyer:
                                            <strong>
                                                ${escapeHtml(buyerName)}
                                            </strong>
                                        </span>

                                        <span>
                                            Sale:
                                            <strong>
                                                ${Number(
                                                    sale.price || 0
                                                ).toLocaleString()} 🪙
                                            </strong>
                                        </span>

                                        <span>
                                            Tax:
                                            <strong>
                                                ${Number(
                                                    sale.tax || 0
                                                ).toLocaleString()} 🪙
                                            </strong>
                                        </span>

                                        <span>
                                            ${escapeHtml(date)}
                                        </span>

                                    </div>

                                </div>
                            `;

                        }
                    ).join("");


            } catch (err) {

                console.error(
                    "SELL HISTORY ERROR:",
                    err
                );


                loading.style.display =
                    "none";


                error.textContent =
                    err.message ||
                    "Something went wrong.";


                error.style.display =
                    "block";

            }

        }


        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        loadSellHistory();

    </script>


</body>

</html>

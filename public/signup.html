```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up — ShrekBook</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- LOGO -->

            <div class="auth-title">
                🧌 ShrekBook
            </div>

            <div class="auth-subtitle">
                Join the swamp.
            </div>


            <!-- SIGNUP FORM -->

            <form
                id="signup-form"
                novalidate
            >

                <!-- USERNAME -->

                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Choose a username"
                        maxlength="30"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- DISPLAY NAME -->

                <div class="auth-field">

                    <label for="display_name">
                        Display name
                    </label>

                    <input
                        id="display_name"
                        name="display_name"
                        type="text"
                        placeholder="What should people call you?"
                        maxlength="50"
                        autocomplete="name"
                    >

                </div>


                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        id="confirm-password"
                        name="confirm-password"
                        type="password"
                        placeholder="Enter it again"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    id="signup-button"
                    class="primary-button"
                    type="submit"
                    style="width: 100%; margin-top: 8px;"
                >
                    🧌 Create Account
                </button>


                <!-- ERROR / SUCCESS -->

                <div
                    id="signup-message"
                    class="auth-error"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>


            <!-- LOGIN -->

            <div
                style="
                    text-align: center;
                    margin-top: 22px;
                    color: var(--muted);
                "
            >

                Already have an account?

                <a
                    href="/login.html"
                    style="
                        color: var(--green-light);
                        font-weight: 800;
                    "
                >
                    Log in
                </a>

            </div>


            <!-- HOME -->

            <div
                style="
                    text-align: center;
                    margin-top: 12px;
                "
            >

                <a
                    href="/"
                    style="
                        color: var(--muted);
                        font-size: 13px;
                    "
                >
                    ← Back to ShrekBook
                </a>

            </div>

        </section>

    </main>


    <script src="/signup.js"></script>

</body>

</html>
```




<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">


    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <link rel="stylesheet" href="styles.css">

    <title>Sign Up - ShrekBook</title>




    <title>Create Account - ShrekBook</title>
</head>

<body>

<header>

    <div class="brand">

        <h1>🧌 ShrekBook</h1>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
    </nav>

</header>


<div class="container">

    <div class="welcome">

        <h2>Create your ShrekBook account</h2>

        <form id="signupForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="text"
                id="displayName"
                placeholder="Display name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="url"
                id="avatar"
                placeholder="Avatar URL (optional)"
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>


        <div class="logo">
            🧌
        </div>

        <h1>
            ShrekBook
        </h1>

    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/login.html">
            Login
        </a>

    </nav>

</header>


<main class="container">

<section class="form-box">

    <h2>
        Create Account 🧌
    </h2>


    <form id="signupForm">

        <label>
            Display Name
        </label>

        <input
            id="displayName"
            maxlength="50"
            required
        >


        <label>
            Username
        </label>

        <input
            id="username"
            maxlength="30"
            required
        >


        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            required
        >


        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            minlength="6"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <p id="signupMessage"></p>

</section>

</main>



<script>

document
    .getElementById("signupForm")
    .addEventListener("submit", async (event) => {


            event.preventDefault();


            const body = {

                displayName:
                    document.getElementById(
                        "displayName"
                    ).value.trim(),

                username:
                    document.getElementById(
                        "username"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "email"
                    ).value.trim(),

                password:
                    document.getElementById(
                        "password"
                    ).value

            };


            const message =
                document.getElementById(
                    "signupMessage"
                );


            message.textContent =
                "Creating account...";


            try {

                const response =
                    await fetch(
                        "/api/signup",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(body)

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Signup failed."
                    );

                }


                message.textContent =
                    "✅ Account created!";


                setTimeout(
                    () => {

                        location.href =
                            "/login.html";

                    },
                    1000
                );


            } catch (error) {

                message.textContent =
                    "❌ " +
                    error.message;

            }

        }
    );

</script>

</body>

</html>



</html>

<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - ShrekBook</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

<header>

    <h1>🧌 ShrekBook</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/login.html">
            Login
        </a>
    </nav>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>


        <form id="signupForm">

            <input
                id="username"
                placeholder="Username"
                required
            >

            <input
                id="displayName"
                placeholder="Display name"
                required
            >

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                minlength="6"
                required
            >

            <input
                id="avatar"
                placeholder="Avatar URL (optional)"
            >

            <button type="submit">
                Create Account 🧌
            </button>

        </form>


        <p id="message"></p>

    </div>

</main>


<script>

document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const message =
                document.getElementById(
                    "message"
                );


            const response =
                await fetch(
                    "/api/signup",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            username:
                                document.getElementById(
                                    "username"
                                ).value,

                            displayName:
                                document.getElementById(
                                    "displayName"
                                ).value,

                            email:
                                document.getElementById(
                                    "email"
                                ).value,

                            password:
                                document.getElementById(
                                    "password"
                                ).value,

                            avatar:
                                document.getElementById(
                                    "avatar"
                                ).value

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.error ||
                    "Signup failed.";

                return;
            }


            localStorage.setItem(
                "shrekbook_user_id",
                data.user.id
            );


            message.textContent =
                "Account created! 🎉";


            setTimeout(() => {

                window.location.href =
                    "/";

            }, 500);

        }
    );

</script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="styles.css">

    <title>Create Account - ShrekBook</title>
</head>

<body>

<header>

    <div class="brand">
        <h1>🧌 ShrekBook</h1>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
    </nav>

</header>


<div class="container">

    <div class="welcome">

        <h2>Create your ShrekBook account</h2>

        <form id="signupForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="text"
                id="displayName"
                placeholder="Display name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="url"
                id="avatar"
                placeholder="Avatar URL (optional)"
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>


<script>

document
    .getElementById("signupForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const message =
            document.getElementById("message");

        message.textContent =
            "Creating account...";

        try {

            const response = await fetch(
                "/api/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username:
                            document.getElementById(
                                "username"
                            ).value,

                        displayName:
                            document.getElementById(
                                "displayName"
                            ).value,

                        email:
                            document.getElementById(
                                "email"
                            ).value,

                        password:
                            document.getElementById(
                                "password"
                            ).value,

                        avatar:
                            document.getElementById(
                                "avatar"
                            ).value

                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok) {

                message.textContent =
                    data.error ||
                    "Signup failed.";

                return;
            }

            message.textContent =
                "Account created! 🎉";

            setTimeout(() => {

                window.location.href =
                    "/login.html";

            }, 1000);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong.";

        }

    });

</script>

</body>
</html>

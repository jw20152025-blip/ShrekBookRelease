<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - ShrekBook</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >

</head>

<body>

<header>

    <div class="brand">

        <img
            class="avatar"
            src="/shrek.webp"
            alt="Shrek"
        >

        <h1>ShrekBook</h1>

    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/login.html">
            Login
        </a>

    </nav>

</header>


<main class="container">

    <section class="form-box">

        <h2>Create Account 🧌</h2>

        <form id="signupForm">


            <label for="displayName">
                Display Name
            </label>

            <input
                id="displayName"
                type="text"
                required
                maxlength="50"
            >


            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                required
                maxlength="30"
            >


            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
                autocomplete="email"
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p id="signupMessage"></p>

        <p>

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </p>

    </section>

</main>


<script>

document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const displayName =
            document.getElementById(
                "displayName"
            ).value.trim();

        const username =
            document.getElementById(
                "username"
            ).value.trim();

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;

        const message =
            document.getElementById(
                "signupMessage"
            );

        message.textContent =
            "Creating account...";

        try {

            const response =
                await fetch("/api/signup", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        displayName,
                        username,
                        email,
                        password

                    })

                });

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Signup failed"
                );

            }

            message.textContent =
                "✅ Account created!";

            setTimeout(() => {

                window.location.href =
                    "/login.html";

            }, 1000);

        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ " + error.message;

        }

    });

</script>

</body>

</html>

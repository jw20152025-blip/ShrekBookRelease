<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101114;
            color: white;
        }

        .topbar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            background: #17191f;
            border-bottom: 1px solid #292c35;
        }

        .house-title {
            font-size: 20px;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #272a33;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #343844;
        }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr 260px;
            height: calc(100vh - 64px);
        }

        .sidebar,
        .members {
            background: #15171c;
            border-right: 1px solid #292c35;
            overflow-y: auto;
        }

        .members {
            border-right: 0;
            border-left: 1px solid #292c35;
            padding: 18px;
        }

        .sidebar {
            padding: 16px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #8d929e;
            margin: 8px 0;
            font-weight: bold;
        }

        .room {
            width: 100%;
            text-align: left;
            margin-bottom: 5px;
            background: transparent;
        }

        .room.active {
            background: #292d38;
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .room-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #292c35;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #2c303a;
        }

        .message-name {
            font-weight: bold;
        }

        .message-time {
            color: #747985;
            font-size: 12px;
            margin-left: 8px;
        }

        .message-content {
            margin-top: 4px;
            color: #d7dae0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .composer {
            padding: 14px;
            border-top: 1px solid #292c35;
            display: flex;
            gap: 10px;
        }

        .composer input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30343e;
            background: #20232a;
            color: white;
            outline: none;
        }

        .member {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .member-info {
            min-width: 0;
        }

        .member-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-role {
            color: #8e949f;
            font-size: 12px;
        }

        .empty {
            color: #777d88;
            text-align: center;
            margin-top: 50px;
        }

        @media(max-width: 900px) {
            .layout {
                grid-template-columns: 190px 1fr;
            }

            .members {
                display: none;
            }
        }

        @media(max-width: 650px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="house-title" id="houseName">
        Loading house...
    </div>

    <div class="actions">
        <button onclick="openSettings()">⚙️ Settings</button>
        <button onclick="leaveHouse()">Leave</button>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">
        <div class="section-title">Rooms</div>

        <div id="rooms"></div>

        <div style="margin-top:20px;">
            <button id="createRoomButton" onclick="createRoom()" style="width:100%;">
                + Create Room
            </button>
        </div>
    </aside>

    <main class="main">

        <div class="room-header">
            <div>
                <strong id="roomName">Select a room</strong>
                <div id="roomDescription" style="font-size:12px;color:#858b96;"></div>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="empty">
                Select a room.
            </div>
        </div>

        <form class="composer" id="messageForm">
            <input
                id="messageInput"
                autocomplete="off"
                maxlength="4000"
                placeholder="Message this room..."
            >

            <button type="submit">
                Send
            </button>
        </form>

    </main>

    <aside class="members">

        <div class="section-title">
            Members
        </div>

        <div id="members"></div>

    </aside>

</div>

<script>
    const params = new URLSearchParams(location.search);
    const houseId = params.get("id");

    let houseData = null;
    let selectedRoom = null;
    let messageTimer = null;

    if (!houseId) {
        alert("No house ID.");
        location.href = "/house-directory.html";
    }

    async function api(url, options = {}) {
        const response = await fetch(url, {
            credentials: "include",
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.error || "Request failed."
            );
        }

        return data;
    }

    async function loadHouse() {
        try {
            houseData = await api(
                `/api/houses/${houseId}`
            );

            document.getElementById("houseName").textContent =
                houseData.house.name;

            renderRooms();
            renderMembers();

            if (houseData.rooms.length) {
                selectRoom(
                    selectedRoom?.id ||
                    houseData.rooms[0].id
                );
            }

            const isAdmin =
                houseData.membership.role === "owner" ||
                houseData.membership.role === "admin";

            document.getElementById(
                "createRoomButton"
            ).style.display = isAdmin
                ? "block"
                : "none";

        } catch (error) {
            alert(error.message);
            location.href = "/house-directory.html";
        }
    }

    function renderRooms() {
        const container =
            document.getElementById("rooms");

        container.innerHTML = "";

        for (const room of houseData.rooms) {
            const button =
                document.createElement("button");

            button.className = "room";

            if (
                selectedRoom &&
                String(selectedRoom.id) ===
                String(room.id)
            ) {
                button.classList.add("active");
            }

            let icon = "💬";

            if (room.room_type === "voice") {
                icon = "🎤";
            }

            if (room.room_type === "media") {
                icon = "🖼️";
            }

            if (room.room_type === "announcement") {
                icon = "📢";
            }

            button.textContent =
                `${icon} ${room.name}`;

            button.onclick = () =>
                selectRoom(room.id);

            container.appendChild(button);
        }
    }

    function renderMembers() {
        const container =
            document.getElementById("members");

        container.innerHTML = "";

        for (const member of houseData.members) {
            const wrapper =
                document.createElement("div");

            wrapper.className = "member";

            const avatar =
                document.createElement("img");

            avatar.className = "avatar";

            avatar.src =
                member.profile?.avatar ||
                "/default-avatar.png";

            const info =
                document.createElement("div");

            info.className = "member-info";

            const name =
                document.createElement("div");

            name.className = "member-name";

            name.textContent =
                member.profile?.display_name ||
                member.profile?.username ||
                "Unknown user";

            const role =
                document.createElement("div");

            role.className = "member-role";

            role.textContent =
                member.role;

            info.appendChild(name);
            info.appendChild(role);

            wrapper.appendChild(avatar);
            wrapper.appendChild(info);

            container.appendChild(wrapper);
        }
    }

    async function selectRoom(roomId) {
        const room =
            houseData.rooms.find(
                r => String(r.id) === String(roomId)
            );

        if (!room) return;

        selectedRoom = room;

        document.getElementById("roomName")
            .textContent =
            `${room.room_type === "voice" ? "🎤" : "💬"} ${room.name}`;

        document.getElementById("roomDescription")
            .textContent =
            room.description || "";

        renderRooms();

        await loadMessages();

        clearInterval(messageTimer);

        messageTimer = setInterval(
            loadMessages,
            2500
        );
    }

    async function loadMessages() {
        if (!selectedRoom) return;

        try {
            const data = await api(
                `/api/houses/${houseId}/rooms/${selectedRoom.id}/messages`
            );

            const container =
                document.getElementById("messages");

            const wasAtBottom =
                container.scrollHeight -
                container.scrollTop -
                container.clientHeight < 100;

            container.innerHTML = "";

            if (!data.messages.length) {
                container.innerHTML =
                    `<div class="empty">No messages yet.</div>`;

                return;
            }

            for (const message of data.messages) {
                renderMessage(message, container);
            }

            if (wasAtBottom) {
                container.scrollTop =
                    container.scrollHeight;
            }
        } catch (error) {
            console.error(error);
        }
    }

    function renderMessage(message, container) {
        const wrapper =
            document.createElement("div");

        wrapper.className = "message";

        const avatar =
            document.createElement("img");

        avatar.className = "avatar";

        avatar.src =
            message.profile?.avatar ||
            "/default-avatar.png";

        const body =
            document.createElement("div");

        const header =
            document.createElement("div");

        const name =
            document.createElement("span");

        name.className = "message-name";

        name.textContent =
            message.profile?.display_name ||
            message.profile?.username ||
            "Unknown";

        const time =
            document.createElement("span");

        time.className = "message-time";

        time.textContent =
            new Date(
                message.created_at
            ).toLocaleString();

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.textContent =
            message.content;

        header.appendChild(name);
        header.appendChild(time);

        body.appendChild(header);
        body.appendChild(content);

        wrapper.appendChild(avatar);
        wrapper.appendChild(body);

        container.appendChild(wrapper);
    }

    document.getElementById("messageForm")
        .addEventListener("submit", async event => {
            event.preventDefault();

            if (!selectedRoom) return;

            const input =
                document.getElementById("messageInput");

            const content =
                input.value.trim();

            if (!content) return;

            input.disabled = true;

            try {
                await api(
                    `/api/houses/${houseId}/rooms/${selectedRoom.id}/messages`,
                    {
                        method: "POST",
                        body: JSON.stringify({
                            content
                        })
                    }
                );

                input.value = "";

                await loadMessages();

            } catch (error) {
                alert(error.message);
            }

            input.disabled = false;
            input.focus();
        });

    async function createRoom() {
        const name =
            prompt("Room name:");

        if (!name) return;

        const type =
            prompt(
                "Room type: text, voice, media, announcement",
                "text"
            ) || "text";

        try {
            await api(
                `/api/houses/${houseId}/rooms`,
                {
                    method: "POST",
                    body: JSON.stringify({
                        name,
                        room_type: type
                    })
                }
            );

            await loadHouse();

        } catch (error) {
            alert(error.message);
        }
    }

    async function leaveHouse() {
        if (
            !confirm(
                "Leave this house?"
            )
        ) {
            return;
        }

        try {
            await api(
                `/api/houses/${houseId}/leave`,
                {
                    method: "POST"
                }
            );

            location.href =
                "/house-directory.html";

        } catch (error) {
            alert(error.message);
        }
    }

    function openSettings() {
        location.href =
            `/house-settings.html?id=${encodeURIComponent(houseId)}`;
    }

    loadHouse();
</script>

</body>
</html>

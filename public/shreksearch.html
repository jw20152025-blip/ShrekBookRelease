<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShrekSearch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(1000px, 92%);
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #searchInput {
            flex: 1;
            padding: 15px 18px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #777;
        }

        #searchButton {
            padding: 15px 24px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #searchButton:hover {
            opacity: 0.85;
        }

        #searchButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           AI ANSWER
        ========================= */

        #aiAnswerSection {
            display: none;
            background: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .ai-answer-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        #aiAnswer {
            font-size: 17px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* =========================
           LOADING
        ========================= */

        #loading {
            display: none;
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* =========================
           ERROR
        ========================= */

        #error {
            display: none;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 10px;
            background: #ffe5e5;
            color: #a00000;
        }

        /* =========================
           RESULTS
        ========================= */

        #results {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result {
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 20px;
            transition: transform 0.15s ease,
                        box-shadow 0.15s ease;
        }

        .result:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .result-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .result-title a {
            color: #1a0dab;
            text-decoration: none;
        }

        .result-title a:hover {
            text-decoration: underline;
        }

        .result-url {
            color: #16821a;
            font-size: 14px;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .result-description {
            color: #444;
            line-height: 1.6;
        }

        .no-results {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        @media (max-width: 600px) {

            .logo {
                font-size: 32px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🧌 ShrekSearch
    </div>

    <div class="subtitle">
        Search the web with ShrekAI
    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="Search the web..."
            autocomplete="off"
        >

        <button id="searchButton">
            Search
        </button>

    </div>

    <!-- ERROR -->

    <div id="error"></div>

    <!-- LOADING -->

    <div id="loading">
        🔎 Searching the web and generating your answer...
    </div>

    <!-- AI ANSWER -->

    <section id="aiAnswerSection">

        <div class="ai-answer-header">
            🤖 ShrekAI Answer
        </div>

        <div id="aiAnswer">
            AI summary unavailable
        </div>

    </section>

    <!-- RESULTS -->

    <div id="results"></div>

</div>


<script>

    // ============================================================
    // SHREKSEARCH FRONTEND
    // ============================================================

    const searchInput =
        document.getElementById("searchInput");

    const searchButton =
        document.getElementById("searchButton");

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const aiAnswerSection =
        document.getElementById("aiAnswerSection");

    const aiAnswer =
        document.getElementById("aiAnswer");

    const resultsContainer =
        document.getElementById("results");


    // ============================================================
    // ESCAPE HTML
    // ============================================================

    function escapeHtml(text) {

        if (text === null || text === undefined) {
            return "";
        }

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ============================================================
    // SEARCH
    // ============================================================

    async function searchShrekSearch() {

        const query =
            searchInput.value.trim();

        if (!query) {
            return;
        }

        // Reset UI

        errorBox.style.display = "none";

        aiAnswerSection.style.display = "none";

        resultsContainer.innerHTML = "";

        loading.style.display = "block";

        searchButton.disabled = true;

        try {

            console.log(
                "Searching ShrekSearch:",
                query
            );


            // ====================================================
            // CALL BACKEND
            // ====================================================

            const response = await fetch(
                "/api/shreksearch?q=" +
                encodeURIComponent(query)
            );


            // ====================================================
            // READ JSON
            // ====================================================

            const data =
                await response.json();


            console.log(
                "ShrekSearch response:",
                data
            );


            // ====================================================
            // ERROR
            // ====================================================

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Search failed"
                );

            }


            // ====================================================
            // AI ANSWER
            // ====================================================

            if (
                data.answer &&
                data.answer.trim()
            ) {

                aiAnswer.textContent =
                    data.answer;

                aiAnswerSection.style.display =
                    "block";

            }


            // ====================================================
            // SEARCH RESULTS
            // ====================================================

            const results =
                Array.isArray(data.results)
                    ? data.results
                    : [];


            if (results.length === 0) {

                resultsContainer.innerHTML = `
                    <div class="no-results">
                        No search results found.
                    </div>
                `;

            } else {

                results.forEach(result => {

                    const title =
                        escapeHtml(
                            result.title ||
                            "Untitled"
                        );

                    const url =
                        escapeHtml(
                            result.url ||
                            ""
                        );

                    const description =
                        escapeHtml(
                            result.description ||
                            result.content ||
                            "No description available."
                        );


                    const resultElement =
                        document.createElement("div");

                    resultElement.className =
                        "result";


                    resultElement.innerHTML = `

                        <div class="result-title">

                            <a
                                href="${url}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                ${title}
                            </a>

                        </div>

                        <div class="result-url">
                            ${url}
                        </div>

                        <div class="result-description">
                            ${description}
                        </div>

                    `;


                    resultsContainer.appendChild(
                        resultElement
                    );

                });

            }

        } catch (error) {

            console.error(
                "SHREKSEARCH ERROR:",
                error
            );


            errorBox.textContent =
                "❌ " +
                (
                    error.message ||
                    "Search failed"
                );


            errorBox.style.display =
                "block";

        } finally {

            loading.style.display =
                "none";

            searchButton.disabled =
                false;

        }

    }


    // ============================================================
    // BUTTON
    // ============================================================

    searchButton.addEventListener(
        "click",
        searchShrekSearch
    );


    // ============================================================
    // ENTER KEY
    // ============================================================

    searchInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                searchShrekSearch();

            }

        }
    );

</script>

</body>
</html>

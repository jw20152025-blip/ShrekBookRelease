
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Inventory - ShrekBook 🧌</title>

<link
    rel="icon"
    type="image/png"
    href="/favicon.png">

<link
    rel="stylesheet"
    href="/styles.css">

<style>
/* ==================================================
   DISPLAYED ITEMS
================================================== */

.displayed-items {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 8px;

    margin: 5px auto 15px;

    max-width: 700px;

}

.displayed-item {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    padding: 6px 12px;

    border-radius: 999px;

    background: rgba(0, 0, 0, 0.06);

    font-size: 14px;

    font-weight: 700;

}

.displayed-item-icon {

    font-size: 22px;

    line-height: 1;

}

.displayed-item-name {

    line-height: 1.2;

}
.inventory-container {

    max-width: 1100px;

    margin: 40px auto;

    padding: 20px;

}

.inventory-header {

    text-align: center;

    margin-bottom: 35px;

}

.inventory-header h1 {

    font-size: 40px;

    margin-bottom: 10px;

}

.inventory-header p {

    color: #666;

}

.equipped-box {

    background: white;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 30px;

    box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);

    text-align: center;

}

.equipped-title {

    font-size: 28px;

    font-weight: bold;

    margin-top: 10px;

}

.inventory-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 20px;

}

.inventory-item {

    background: white;

    border-radius: 18px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);

}

.item-icon {

    font-size: 55px;

    margin-bottom: 10px;

}

.inventory-item h2 {

    margin: 10px 0;

}

.inventory-item p {

    color: #666;

    min-height: 45px;

}

.item-date {

    font-size: 13px;

    color: #888;

    margin-bottom: 15px;

}

.inventory-button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

    font-size: 15px;

}

.inventory-button:hover {

    opacity: 0.8;

}

.inventory-button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}

.unequip-button {

    margin-top: 15px;

    padding: 10px 20px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

}

.empty-inventory {

    text-align: center;

    padding: 50px 20px;

    background: white;

    border-radius: 18px;

    box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);

}

#inventory-status {

    text-align: center;

    margin: 20px;

    font-weight: bold;

}

@media (max-width: 600px) {

    .inventory-header h1 {

        font-size: 30px;

    }

    .inventory-container {

        padding: 15px;

    }

}

</style>

</head>

<body>

<header class="navbar">

<div class="navbar-inner">

    <a
        href="/"
        class="logo">

        🧌 ShrekBook

    </a>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/profile.html">
            Profile
        </a>

        <a href="/svis.html">
            🛒 SVIS
        </a>

    </nav>

</div>

</header>


<main class="inventory-container">

<div class="inventory-header">

    <h1>
        🎒 My ShrekBook Inventory
    </h1>

    <p>
        Your collection of completely unnecessary
        virtual swamp items. 🧌
    </p>

</div>


<div id="inventory-status">
    Loading inventory...
</div>


<!-- ==========================================
     EQUIPPED TITLE
=========================================== -->

<section class="equipped-box">

    <h2>
        🏷️ Equipped Title
    </h2>

    <div
        id="equipped-title"
        class="equipped-title">

        Loading...

    </div>

    <button
        class="inventory-button"
        id="equipped-item-button">

        ${
            item.equipped
                ? "❌ Undisplay Item"
                : item.item_type === "title"
                    ? "🏷️ Equip Title"
                    : "✨ Display Item"
        }

    </button>

</section>


<!-- ==========================================
     INVENTORY
=========================================== -->

<section>

    <h2>
        🎒 Your Items
    </h2>

    <div
        id="inventory"
        class="inventory-grid">

    </div>

</section>

</main>


<script>


/* ==================================================
   LOAD INVENTORY
================================================== */

async function loadInventory() {

    const status =
        document.getElementById(
            "inventory-status"
        );

    const inventory =
        document.getElementById(
            "inventory"
        );


    try {

        const response =
            await fetch(
                "/api/shop/inventory",
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            status.textContent =
                "❌ " +
                (
                    data.error ||
                    "Could not load inventory."
                );

            return;

        }


        status.textContent =
            "";


        /* ==========================================
           EQUIPPED TITLE
        ========================================== */

        const equippedTitle =
            data.equipped;


        const equippedElement =
            document.getElementById(
                "equipped-title"
            );


        const unequipButton =
            document.getElementById(
                "unequip-button"
            );


        if (equippedTitle) {

            equippedElement.textContent =
                (
                    equippedTitle.icon ||
                    "🏷️"
                ) +
                " " +
                (
                    equippedTitle.name ||
                    "Unknown Title"
                );

            unequipButton.style.display =
                "inline-block";

        } else {

            equippedElement.textContent =
                "No title equipped";

            unequipButton.style.display =
                "none";

        }


        /* ==========================================
           ITEMS
        ========================================== */

        inventory.innerHTML = "";


        if (
            !data.items ||
            data.items.length === 0
        ) {

            inventory.innerHTML = `

                <div class="empty-inventory">

                    <h2>
                        🎒 Your inventory is empty
                    </h2>

                    <p>
                        Go buy some damn items.
                        🧌
                    </p>

                    <a href="/svis.html">
                        🛒 Visit the Shop
                    </a>

                </div>

            `;

            return;

        }


        /* ==========================================
           CREATE CARDS
        ========================================== */

        data.items.forEach(item => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "inventory-item";


            /* ======================================
               DETERMINE ITEM TYPE
            ====================================== */

            const isTitle =
                item.item_type ===
                "title";


            const isNormalItem =
                item.item_type ===
                "item";


            /* ======================================
               EQUIPPED / DISPLAYED
            ====================================== */

            const isEquippedTitle =
                isTitle &&
                equippedTitle &&
                String(
                    equippedTitle.id
                ) ===
                String(
                    item.id
                );


            const isDisplayedItem =
                isNormalItem &&
                item.equipped === true;


            /* ======================================
               BUTTON
            ====================================== */

            let buttonText;
            let buttonAction;
            let disabled = false;

            if (item.item_type === "title") {

                if (isEquippedTitle) {

                    buttonText =
                        "✅ Equipped";

                    disabled =
                        true;

                } else {

                    buttonText =
                        "🏷️ Equip Title";

                    buttonAction =
                        `equipItem('${escapeAttribute(item.id)}')`;

                }

            } else {

                if (item.equipped === true) {

                    buttonText =
                        "❌ Undisplay";

                    buttonAction =
                        `equipItem('${escapeAttribute(item.id)}')`;

                } else {

                    buttonText =
                        "✨ Display Item";

                    buttonAction =
                        `equipItem('${escapeAttribute(item.id)}')`;

                }

            }


            /* ======================================
               CARD
            ====================================== */

            card.innerHTML = `

                <div class="item-icon">

                    ${escapeHtml(
                        item.icon ||
                        "🎁"
                    )}

                </div>


                <h2>

                    ${escapeHtml(
                        item.name ||
                        "Unnamed Item"
                    )}

                </h2>


                <p>

                    ${escapeHtml(
                        item.description ||
                        "No description."
                    )}

                </p>


                <div class="item-date">

                    Purchased:
                    ${formatDate(
                        item.purchased_at
                    )}

                </div>


                <button
                    class="inventory-button"
                    onclick="${buttonAction}"
                    ${disabled ? "disabled" : ""}>

                    ${buttonText}

                </button>

            `;


            inventory.appendChild(
                card
            );

        });


    } catch (error) {

        console.error(
            "INVENTORY ERROR:",
            error
        );

        status.textContent =
            "❌ Could not load inventory.";

    }

}


// ==================================================
// EQUIP / DISPLAY ITEM
// ==================================================

async function equipItem(itemId) {

    try {

        const response =
            await fetch(
                "/api/shop/equip",
                {
                    method:
                        "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            item_id:
                                itemId
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                "❌ " +
                (
                    data.error ||
                    "Could not equip item."
                )
            );

            return;

        }


        if (
            data.type ===
            "title"
        ) {

            alert(
                "🏷️ Title equipped!"
            );

        } else {

            alert(
                "✨ Item displayed!"
            );

        }


        loadInventory();


    } catch (error) {

        console.error(
            "EQUIP ERROR:",
            error
        );


        alert(
            "❌ Could not equip item."
        );

    }

}

/* ==================================================
   UNEQUIP TITLE
================================================== */

async function unequipTitle() {

    try {

        const response =
            await fetch(
                "/api/shop/unequip",
                {

                    method:
                        "POST",

                    credentials:
                        "include"

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                "❌ " +
                (
                    data.error ||
                    "Could not unequip title."
                )
            );

            return;

        }


        alert(
            "❌ Title unequipped."
        );


        loadInventory();


    } catch (error) {

        console.error(
            "UNEQUIP ERROR:",
            error
        );

        alert(
            "❌ Could not unequip title."
        );

    }

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHtml(
        value
    );

}


/* ==================================================
   DATE
================================================== */

function formatDate(date) {

    if (!date) {

        return "Unknown";

    }


    const parsed =
        new Date(date);


    if (
        Number.isNaN(
            parsed.getTime()
        )
    ) {

        return "Unknown";

    }


    return parsed.toLocaleDateString();

}


/* ==================================================
   START
================================================== */

loadInventory();

</script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Inventory - ShrekBook 🧌</title>

<link
    rel="icon"
    type="image/png"
    href="/favicon.png">

<link
    rel="stylesheet"
    href="/styles.css">

<style>

/* ==================================================
   INVENTORY CONTAINER
================================================== */

.inventory-container {

    max-width: 1100px;

    margin: 40px auto;

    padding: 20px;

}


/* ==================================================
   HEADER
================================================== */

.inventory-header {

    text-align: center;

    margin-bottom: 35px;

}

.inventory-header h1 {

    font-size: 40px;

    margin-bottom: 10px;

}

.inventory-header p {

    color: #666;

}


/* ==================================================
   BOXES
================================================== */

.equipped-box {

    background: white;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 30px;

    box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);

    text-align: center;

}


/* ==================================================
   EQUIPPED TITLE
================================================== */

.equipped-title {

    font-size: 28px;

    font-weight: bold;

    margin-top: 10px;

}


/* ==================================================
   DISPLAYED ITEMS
================================================== */

.displayed-items {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;

}


/* ==================================================
   DISPLAYED ITEM
================================================== */

.displayed-item {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    padding: 7px 13px;

    border-radius: 999px;

    background: rgba(0, 0, 0, 0.06);

    font-size: 14px;

    font-weight: 700;

}


.displayed-item-icon {

    font-size: 22px;

    line-height: 1;

}


.displayed-item-name {

    line-height: 1.2;

}


/* ==================================================
   INVENTORY GRID
================================================== */

.inventory-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 20px;

}


/* ==================================================
   INVENTORY CARD
================================================== */

.inventory-item {

    background: white;

    border-radius: 18px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);

}


/* ==================================================
   ITEM ICON
================================================== */

.item-icon {

    font-size: 55px;

    margin-bottom: 10px;

}


/* ==================================================
   ITEM TEXT
================================================== */

.inventory-item h2 {

    margin: 10px 0;

}


.inventory-item p {

    color: #666;

    min-height: 45px;

}


/* ==================================================
   DATE
================================================== */

.item-date {

    font-size: 13px;

    color: #888;

    margin-bottom: 15px;

}


/* ==================================================
   BUTTON
================================================== */

.inventory-button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

    font-size: 15px;

}


.inventory-button:hover {

    opacity: 0.8;

}


.inventory-button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}


/* ==================================================
   UNEQUIP TITLE
================================================== */

.unequip-button {

    margin-top: 15px;

    padding: 10px 20px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

}


/* ==================================================
   EMPTY INVENTORY
================================================== */

.empty-inventory {

    text-align: center;

    padding: 50px 20px;

    background: white;

    border-radius: 18px;

    box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.08);

}


/* ==================================================
   STATUS
================================================== */

#inventory-status {

    text-align: center;

    margin: 20px;

    font-weight: bold;

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    .inventory-header h1 {

        font-size: 30px;

    }

    .inventory-container {

        padding: 15px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     NAVBAR
================================================== -->

<header class="navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="logo">

            🧌 ShrekBook

        </a>


        <nav>

            <a href="/">
                Home
            </a>

            <a href="/profile.html">
                Profile
            </a>

            <a href="/svis.html">
                🛒 SVIS
            </a>

        </nav>

    </div>

</header>


<!-- ==================================================
     MAIN
================================================== -->

<main class="inventory-container">


<div class="inventory-header">

    <h1>
        🎒 My ShrekBook Inventory
    </h1>

    <p>
        Your collection of completely unnecessary
        virtual swamp items. 🧌
    </p>

</div>


<div id="inventory-status">
    Loading inventory...
</div>


<!-- ==================================================
     EQUIPPED TITLE
================================================== -->

<section class="equipped-box">

    <h2>
        🏷️ Equipped Title
    </h2>


    <div
        id="equipped-title"
        class="equipped-title">

        Loading...

    </div>


    <button
        id="unequip-title-button"
        class="unequip-button"
        onclick="unequipTitle()"
        style="display:none;">

        ❌ Unequip Title

    </button>

</section>


<!-- ==================================================
     DISPLAYED ITEMS
================================================== -->

<section class="equipped-box">

    <h2>
        🎒 Displayed Items
    </h2>


    <p>
        You can display up to 5 items on your profile.
    </p>


    <div
        id="displayed-items"
        class="displayed-items">

    </div>

</section>


<!-- ==================================================
     INVENTORY
================================================== -->

<section>

    <h2>
        🎒 Your Items
    </h2>


    <div
        id="inventory"
        class="inventory-grid">

    </div>

</section>


</main>


<script>


/* ==================================================
   LOAD INVENTORY
================================================== */
// ==================================================
// DISPLAY DISPLAYED ITEM
// ==================================================

function renderDisplayedItem() {

    const itemElement =
        document.getElementById(
            "displayed-item"
        );

    const iconElement =
        document.getElementById(
            "displayed-item-icon"
        );

    const nameElement =
        document.getElementById(
            "displayed-item-name"
        );


    if (
        !itemElement ||
        !iconElement ||
        !nameElement
    ) {
        return;
    }


    // ==========================================
    // GET DISPLAYED ITEMS
    // ==========================================

    const items =
        profileUser &&
        Array.isArray(
            profileUser.displayedItems
        )
            ? profileUser.displayedItems
            : [];


    // ==========================================
    // NO ITEMS
    // ==========================================

    if (items.length === 0) {

        itemElement.style.display =
            "none";

        return;

    }


    // ==========================================
    // SHOW ITEMS
    // ==========================================

    itemElement.style.display =
        "inline-flex";


    iconElement.textContent =
        items
            .map(
                item =>
                    item.icon || "🎁"
            )
            .join(" ");


    nameElement.textContent =
        items
            .map(
                item =>
                    item.name || "Item"
            )
            .join(" • ");

}
async function loadInventory() {

    const status =
        document.getElementById(
            "inventory-status"
        );


    const inventory =
        document.getElementById(
            "inventory"
        );


    const equippedTitleElement =
        document.getElementById(
            "equipped-title"
        );


    const unequipTitleButton =
        document.getElementById(
            "unequip-title-button"
        );


    const displayedItemsElement =
        document.getElementById(
            "displayed-items"
        );


    try {

        const response =
            await fetch(
                "/api/shop/inventory",
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        console.log(
            "🎒 INVENTORY:",
            data
        );


        if (!response.ok) {

            status.textContent =
                "❌ " +
                (
                    data.error ||
                    "Could not load inventory."
                );

            return;

        }


        status.textContent = "";


        /* ==================================================
           EQUIPPED TITLE
        ================================================== */

        const equippedTitle =
            data.equippedTitle ||
            data.equipped ||
            null;


        if (equippedTitle) {

            equippedTitleElement.textContent =
                (
                    equippedTitle.icon ||
                    "🏷️"
                ) +
                " " +
                (
                    equippedTitle.name ||
                    "Unknown Title"
                );


            if (unequipTitleButton) {

                unequipTitleButton.style.display =
                    "inline-block";

            }

        } else {

            equippedTitleElement.textContent =
                "No title equipped";


            if (unequipTitleButton) {

                unequipTitleButton.style.display =
                    "none";

            }

        }


        /* ==================================================
           DISPLAYED ITEMS
        ================================================== */

        displayedItemsElement.innerHTML = "";


        const displayedItems =
            Array.isArray(
                data.displayedItems
            )
                ? data.displayedItems
                : [];


        if (
            displayedItems.length === 0
        ) {

            displayedItemsElement.innerHTML = `

                <div class="empty-inventory">

                    <p>
                        🎒 No items are currently displayed.
                    </p>

                </div>

            `;

        } else {

            displayedItems.forEach(
                item => {

                    const displayed =
                        document.createElement(
                            "div"
                        );


                    displayed.className =
                        "displayed-item";


                    displayed.innerHTML = `

                        <span
                            class="displayed-item-icon">

                            ${escapeHtml(
                                item.icon ||
                                "🎁"
                            )}

                        </span>


                        <span
                            class="displayed-item-name">

                            ${escapeHtml(
                                item.name ||
                                "Item"
                            )}

                        </span>

                    `;


                    displayedItemsElement.appendChild(
                        displayed
                    );

                }
            );

        }


        /* ==================================================
           INVENTORY
        ================================================== */

        inventory.innerHTML = "";


        if (
            !data.items ||
            data.items.length === 0
        ) {

            inventory.innerHTML = `

                <div class="empty-inventory">

                    <h2>
                        🎒 Your inventory is empty
                    </h2>

                    <p>
                        Go buy some damn items.
                        🧌
                    </p>

                    <a href="/svis.html">
                        🛒 Visit the Shop
                    </a>

                </div>

            `;

            return;

        }


        /* ==================================================
           CREATE ITEM CARDS
        ================================================== */

        data.items.forEach(
            item => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "inventory-item";


                const isTitle =
                    item.item_type ===
                    "title";
                const isAvatar =
                    item.item_type ===
                    "avatar";


                const isDisplayed =
                    displayedItems.some(
                        displayed =>
                            String(
                                displayed.id
                            ) ===
                            String(
                                item.id
                            )
                    );


                /* ==================================================
                   BUTTON
                ================================================== */

                let buttonText;

                let buttonAction;

                let disabled =
                    false;

                console.log(
                    "ITEM TYPE:",
                    item.item_type,
                    "ITEM:",
                    item
                );
                if (isTitle) {

                    const isEquipped =
                        equippedTitle &&
                        String(
                            equippedTitle.id
                        ) ===
                        String(
                            item.id
                        );

                    if (isEquipped) {

                        buttonText =
                            "✅ Equipped";

                        disabled =
                            true;

                    } else {

                        buttonText =
                            "🏷️ Equip Title";

                        buttonAction =
                            `equipItem(${Number(item.id)})`;

                    }

                } else if (
                    item.item_type === "avatar"
                ) {

                    buttonText =
                        "⬇️ Download .SB Avatar";

                    buttonAction =
                        `downloadAvatar(${Number(item.id)}, ${JSON.stringify(item.name || "ShrekBook-Avatar")})`;

                } else {

                    if (isDisplayed) {

                        buttonText =
                            "❌ Undisplay";

                        buttonAction =
                            `undisplayItem(${Number(item.id)})`;

                    } else {

                        buttonText =
                            "✨ Display Item";

                        buttonAction =
                            `equipItem(${Number(item.id)})`;

                    }

                }


                /* ==================================================
                   CARD
                ================================================== */

                card.innerHTML = `

                    <div class="item-icon">

                        ${escapeHtml(
                        item.icon ||
                        (
                            isTitle
                                ? "🏷️"
                                : isAvatar
                                    ? "🧌"
                                    : "🎁"
                        )
                        )}

                    </div>


                    <h2>

                        ${escapeHtml(
                            item.name ||
                            "Unnamed Item"
                        )}

                    </h2>


                    <p>

                        ${escapeHtml(
                            item.description ||
                            "No description."
                        )}

                    </p>


                    <div class="item-date">

                        Purchased:
                        ${formatDate(
                            item.purchased_at
                        )}

                    </div>


                    <button
                        class="inventory-button"
                        onclick="${buttonAction || ""}"
                        ${disabled ? "disabled" : ""}>

                        ${buttonText}

                    </button>

                `;


                inventory.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "INVENTORY ERROR:",
            error
        );


        status.textContent =
            "❌ Could not load inventory.";

    }

}


/* ==================================================
   EQUIP ITEM / TITLE
================================================== */

async function equipItem(itemId) {

    try {

        const response =
            await fetch(
                "/api/shop/equip",
                {

                    method:
                        "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            item_id:
                                Number(itemId)
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                "❌ " +
                (
                    data.error ||
                    "Could not equip item."
                )
            );

            return;

        }


        if (
            data.type ===
            "title"
        ) {

            alert(
                "🏷️ Title equipped!"
            );

        } else {

            alert(
                "✨ Item displayed!"
            );

        }


        await loadInventory();


    } catch (error) {

        console.error(
            "EQUIP ERROR:",
            error
        );


        alert(
            "❌ Could not equip item."
        );

    }

}


/* ==================================================
   UNDISPLAY ITEM
================================================== */

async function undisplayItem(itemId) {

    try {

        const response =
            await fetch(
                "/api/shop/undisplay",
                {

                    method:
                        "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            item_id:
                                Number(itemId)
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                "❌ " +
                (
                    data.error ||
                    "Could not undisplay item."
                )
            );

            return;

        }


        alert(
            "❌ Item undisplayed!"
        );


        await loadInventory();


    } catch (error) {

        console.error(
            "UNDISPLAY ERROR:",
            error
        );


        alert(
            "❌ Could not undisplay item."
        );

    }

}


/* ==================================================
   UNEQUIP TITLE
================================================== */

async function unequipTitle() {

    try {

        const response =
            await fetch(
                "/api/shop/unequip",
                {

                    method:
                        "POST",

                    credentials:
                        "include"

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                "❌ " +
                (
                    data.error ||
                    "Could not unequip title."
                )
            );

            return;

        }


        alert(
            "❌ Title unequipped."
        );


        await loadInventory();


    } catch (error) {

        console.error(
            "UNEQUIP ERROR:",
            error
        );


        alert(
            "❌ Could not unequip title."
        );

    }

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==================================================
   DATE
================================================== */

function formatDate(date) {

    if (!date) {

        return "Unknown";

    }


    const parsed =
        new Date(date);


    if (
        Number.isNaN(
            parsed.getTime()
        )
    ) {

        return "Unknown";

    }


    return parsed.toLocaleDateString();

}

async function downloadAvatar(itemId, itemName) {

    try {

        const response =
            await fetch(
                `/api/shop/download/${encodeURIComponent(itemId)}`,
                {
                    credentials: "include"
                }
            );

        if (!response.ok) {

            const data =
                await response.json().catch(
                    () => ({})
                );

            alert(
                "❌ " +
                (
                    data.error ||
                    "Could not download avatar."
                )
            );

            return;

        }

        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            `${String(itemName || "shrekbook-avatar")
                .replace(/[^a-z0-9_\- ]/gi, "")
                .trim()
                .replace(/\s+/g, "-")}.sb`;

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

    } catch (error) {

        console.error(
            "AVATAR DOWNLOAD ERROR:",
            error
        );

        alert(
            "❌ Could not download avatar."
        );

    }

}
/* ==================================================
   START
================================================== */

loadInventory();

</script>

</body>

</html>

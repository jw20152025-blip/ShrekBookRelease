<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Discord - ShrekBook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(430px, 92%);
            padding: 30px;
            border-radius: 18px;
            background: #1d1d1d;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #aaa;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: .6;
            cursor: default;
        }

        #user {
            margin: 15px 0;
            color: #aaa;
        }

        #status {
            margin-top: 18px;
            font-weight: bold;
        }

        .success {
            color: #57f287;
        }

        .error {
            color: #ed4245;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🟢 Verify Discord</h1>

    <div id="user">
        Checking ShrekBook login...
    </div>

    <p>
        Run <b>/verify</b> in the ShrekBook Discord server.
        Then enter the code the bot gives you.
    </p>

    <input
        id="code"
        type="text"
        placeholder="SB-XXXXXXXXXX"
        maxlength="32"
        autocomplete="off"
    >

    <button id="verifyButton">
        Verify Discord
    </button>

    <div id="status"></div>

</div>

<script>
const userElement = document.getElementById("user");
const codeInput = document.getElementById("code");
const verifyButton = document.getElementById("verifyButton");
const statusElement = document.getElementById("status");

async function checkLogin() {
    try {
        const response = await fetch("/api/discord/me", {
            credentials: "include"
        });

        const data = await response.json();

        if (!data.loggedIn) {
            userElement.textContent =
                "❌ You must be logged into ShrekBook.";

            codeInput.disabled = true;
            verifyButton.disabled = true;
            return;
        }

        userElement.textContent =
            `Logged in as @${data.username}`;

    } catch {
        userElement.textContent =
            "❌ Could not check your ShrekBook login.";
    }
}

verifyButton.addEventListener("click", async () => {
    const code = codeInput.value.trim();

    if (!code) {
        statusElement.className = "error";
        statusElement.textContent =
            "Enter your verification code.";
        return;
    }

    verifyButton.disabled = true;
    verifyButton.textContent = "Submitting...";
    statusElement.textContent = "";

    try {
        const response = await fetch(
            "/api/discord/verification-request",
            {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    code
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Verification failed."
            );
        }

        statusElement.className = "success";
        statusElement.textContent =
            "✅ Code accepted! Check Discord in a few seconds.";

        codeInput.disabled = true;
        verifyButton.textContent = "Waiting for Discord ✓";

    } catch (error) {
        statusElement.className = "error";
        statusElement.textContent =
            "❌ " + error.message;

        verifyButton.disabled = false;
        verifyButton.textContent = "Verify Discord";
    }
});

checkLogin();
</script>

</body>
</html>

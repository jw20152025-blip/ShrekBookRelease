<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>House Invitations</title>

    <style>
        body {
            margin: 0;
            background: #101114;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            background: #17191f;
            border-bottom: 1px solid #292c35;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .invite {
            padding: 20px;
            background: #17191f;
            border: 1px solid #292c35;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            background: #292d37;
            color: white;
            cursor: pointer;
            margin-right: 8px;
        }

        .accept {
            background: #267a43;
        }
    </style>
</head>

<body>

<header>

    <button
        onclick="location.href='/house-directory.html'"
    >
        ← Houses
    </button>

</header>

<main>

    <h1>📨 Invitations</h1>

    <div id="invitations">
        Loading...
    </div>

</main>

<script>
    async function api(url, options = {}) {
        const response =
            await fetch(url, {
                credentials: "include",
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

        const data =
            await response.json()
                .catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Request failed."
            );
        }

        return data;
    }

    async function load() {
        try {
            const data =
                await api(
                    "/api/houses/invitations"
                );

            const container =
                document.getElementById(
                    "invitations"
                );

            container.innerHTML = "";

            if (!data.invitations.length) {
                container.innerHTML =
                    "<p>No pending invitations.</p>";

                return;
            }

            for (const invite of data.invitations) {
                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "invite";

                card.innerHTML = `
                    <h2>
                        ${escapeHtml(
                            invite.house?.name ||
                            "Unknown House"
                        )}
                    </h2>

                    <p>
                        Invited by
                        <strong>
                            ${escapeHtml(
                                invite.inviter?.display_name ||
                                invite.inviter?.username ||
                                "Unknown"
                            )}
                        </strong>
                    </p>

                    <button class="accept">
                        Accept
                    </button>

                    <button>
                        Decline
                    </button>
                `;

                const buttons =
                    card.querySelectorAll(
                        "button"
                    );

                buttons[0].onclick =
                    () =>
                        respond(
                            invite.id,
                            "accept"
                        );

                buttons[1].onclick =
                    () =>
                        respond(
                            invite.id,
                            "decline"
                        );

                container.appendChild(card);
            }

        } catch (error) {
            alert(error.message);
        }
    }

    async function respond(
        id,
        action
    ) {
        try {
            const data =
                await api(
                    `/api/houses/invitations/${id}/respond`,
                    {
                        method: "POST",
                        body: JSON.stringify({
                            action
                        })
                    }
                );

            if (
                action === "accept" &&
                data.house_id
            ) {
                location.href =
                    `/house.html?id=${data.house_id}`;

                return;
            }

            await load();

        } catch (error) {
            alert(error.message);
        }
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    load();
</script>

</body>
</html>

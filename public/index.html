<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShrekBook</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header>

    <div class="brand">
        <img
            class="avatar"
            src="/shrek.webp"
            alt="Shrek"
        >

        <h1>ShrekBook</h1>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
        <a href="/signup.html">Create Account</a>
    </nav>

</header>

<main class="container">

    <section class="welcome">

        <h2>Welcome to ShrekBook! 🧌</h2>

        <p>
            The social network for absolutely normal people.
        </p>

    </section>


    <section class="create-post">

        <h2>Create a Post</h2>

        <textarea
            id="postContent"
            placeholder="What's on your mind?"
        ></textarea>

        <button onclick="createPost()">
            Post 🧌
        </button>

    </section>


    <section>

        <h2>Posts</h2>

        <div id="posts">
            Loading posts...
        </div>

    </section>

</main>

<script src="/script.js"></script>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>ShrekBook</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f1f1;
    }

    header {
        background: #4c8f29;
        color: white;
        padding: 20px;
    }

    header h1 {
        margin: 0;
    }

    nav {
        margin-top: 10px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-right: 20px;
    }

    .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 20px;
    }

    .welcome {
        background: white;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 30px;
    }

    .people {
        display: grid;
        grid-template-columns: repeat(
            auto-fill,
            minmax(220px, 1fr)
        );

        gap: 20px;
    }

    .person {
        background: white;
        padding: 20px;
        text-align: center;
        border-radius: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,.1);
    }

    .person img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 50%;
    }

    .person h3 {
        margin-bottom: 5px;
    }

    .person p {
        color: #777;
    }

    .person a {
        display: inline-block;
        padding: 8px 15px;
        background: #4c8f29;
        color: white;
        border-radius: 8px;
        text-decoration: none;
    }
</style>
```

</head>

<body>

<header>

```
<h1>🧌 ShrekBook</h1>

<nav>
    <a href="/">Home</a>
    <a href="/login.html">Login</a>
    <a href="/signup.html">Create Account</a>
</nav>
```

</header>

<div class="container">

```
<div class="welcome">

    <h2>Welcome to ShrekBook!</h2>

    <p>
        The social network for absolutely normal people.
    </p>

</div>

<h2>People</h2>

<div id="people">
    Loading people...
</div>
```

</div>

<script>

async function loadPeople() {

    const container =
        document.getElementById("people");

    try {

        const response =
            await fetch("/api/users");

        const users =
            await response.json();

        container.innerHTML = "";

        if (users.length === 0) {
            container.innerHTML =
                "<p>No people have joined yet.</p>";
            return;
        }

        users.forEach(user => {

            const person =
                document.createElement("div");

            person.className = "person";

            person.innerHTML = `
                <img
                    src="${user.avatar}"
                    alt="Avatar"
                >

                <h3>
                    ${user.displayName}
                </h3>

                <p>
                    @${user.username}
                </p>

                <a href="/profile.html?id=${user.id}">
                    View Profile
                </a>
            `;

            container.appendChild(person);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Could not load people.</p>";
    }
}

loadPeople();

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

<header>

    <div class="brand">

        <div class="brand-avatar">
            🧌
        </div>

        <h1>ShrekBook</h1>

    </div>


    <nav>

        <a href="/">Home</a>

        <a href="/login.html">
            Login
        </a>

        <a href="/signup.html">
            Create Account
        </a>

        <button
            onclick="logout()"
            class="logout-button"
        >
            Logout
        </button>

    </nav>

</header>


<main class="container">

    <section class="welcome">

        <h2>
            Welcome to ShrekBook! 🧌
        </h2>

        <p>
            The social network for
            absolutely normal people.
        </p>

    </section>


    <section class="post-box">

        <h2>Create a Post</h2>

        <textarea
            id="postContent"
            placeholder="What's on your mind?"
        ></textarea>

        <button onclick="createPost()">
            Post 🧌
        </button>

        <p id="postMessage"></p>

    </section>


    <h2>Posts</h2>

    <div id="posts">
        Loading posts...
    </div>


    <h2>People</h2>

    <div id="people">
        Loading people...
    </div>

</main>


<script>

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// ==========================================
// POSTS
// ==========================================

async function loadPosts() {

    const container =
        document.getElementById("posts");


    try {

        const response =
            await fetch("/api/posts");


        const posts =
            await response.json();


        if (!response.ok) {

            throw new Error(
                posts.error
            );

        }


        container.innerHTML = "";


        if (posts.length === 0) {

            container.innerHTML =
                "<p>No posts yet! Be the first.</p>";

            return;
        }


        posts.forEach(post => {

            const element =
                document.createElement("article");


            element.className =
                "post";


            element.innerHTML = `

                <div class="post-header">

                    <strong>
                        User
                    </strong>

                    <small>
                        ${new Date(
                            post.created_at
                        ).toLocaleString()}
                    </small>

                </div>

                <p class="post-content">
                    ${escapeHTML(
                        post.content
                    )}
                </p>

                <div class="post-actions">

                    <button
                        onclick="likePost('${post.id}')"
                    >
                        👍 Like
                    </button>

                    <button
                        onclick="loadComments('${post.id}')"
                    >
                        💬 Comments
                    </button>

                </div>

                <div
                    id="comments-${post.id}"
                    class="comments"
                ></div>

            `;


            container.appendChild(element);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Could not load posts.</p>";

    }

}


// ==========================================
// CREATE POST
// ==========================================

async function createPost() {

    const input =
        document.getElementById(
            "postContent"
        );


    const message =
        document.getElementById(
            "postMessage"
        );


    const userId =
        localStorage.getItem(
            "shrekbook_user_id"
        );


    if (!userId) {

        message.textContent =
            "You need to log in first.";

        return;
    }


    if (!input.value.trim()) {

        message.textContent =
            "Your post is empty.";

        return;
    }


    const response =
        await fetch(
            "/api/posts",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    user_id:
                        userId,

                    content:
                        input.value

                })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        message.textContent =
            data.error ||
            "Could not post.";

        return;
    }


    input.value = "";

    message.textContent =
        "Posted! 🧌";


    loadPosts();

}


// ==========================================
// COMMENTS
// ==========================================

async function loadComments(postId) {
    const container =
        document.getElementById(`comments-${postId}`);

    container.innerHTML = "Loading comments...";

    try {
        const response = await fetch(
            `/api/posts/${postId}/comments`
        );

        const data = await response.json();

        console.log("Comments response:", data);

        if (!response.ok) {
            throw new Error(
                data.error || "Failed to load comments"
            );
        }

        container.innerHTML = `
            <div class="comment-input">

                <input
                    id="comment-input-${postId}"
                    placeholder="Write a comment..."
                >

                <button
                    onclick="createComment('${postId}')"
                >
                    Comment
                </button>

            </div>
        `;

        if (data.length === 0) {
            container.innerHTML +=
                "<p>No comments yet. Be the first! 🧌</p>";
            return;
        }

        data.forEach(comment => {

            const element =
                document.createElement("div");

            element.className = "comment";

            element.innerHTML = `
                <p>
                    ${escapeHTML(comment.content)}
                </p>

                <small>
                    ${new Date(
                        comment.created_at
                    ).toLocaleString()}
                </small>
            `;

            container.appendChild(element);
        });

    } catch (error) {

        console.error(
            "Comments error:",
            error
        );

        container.innerHTML = `
            <p>
                ❌ Could not load comments:
                ${escapeHTML(error.message)}
            </p>
        `;
    }
}
// ==========================================
// PEOPLE
// ==========================================

async function loadPeople() {

    const container =
        document.getElementById(
            "people"
        );


    try {

        const response =
            await fetch(
                "/api/users"
            );


        const users =
            await response.json();


        container.innerHTML = "";


        users.forEach(user => {

            const element =
                document.createElement("div");


            element.className =
                "person";


            element.innerHTML = `

                <img
                    class="avatar"
                    src="${escapeHTML(
                        user.avatar
                    )}"
                    alt="Avatar"
                >

                <div>

                    <h3>
                        ${escapeHTML(
                            user.display_name
                        )}
                    </h3>

                    <p>
                        @${escapeHTML(
                            user.username
                        )}
                    </p>

                    <a
                        href="/profile.html?id=${user.id}"
                    >
                        View Profile
                    </a>

                </div>

            `;


            container.appendChild(element);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Could not load people.</p>";

    }

}


// ==========================================
// LOGOUT
// ==========================================

async function logout() {

    await fetch(
        "/api/logout",
        {
            method: "POST"
        }
    );


    localStorage.removeItem(
        "shrekbook_user_id"
    );

    localStorage.removeItem(
        "shrekbook_token"
    );


    window.location.href =
        "/login.html";

}


loadPosts();

loadPeople();

</script>

</body>

</html>

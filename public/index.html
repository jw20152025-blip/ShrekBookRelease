<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

<header>

    <h1>🧌 ShrekBook</h1>

    <div>

        <span id="current-user-name">
            Loading...
        </span>

        <button
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>

<main>

    <section>

        <h2>Welcome to ShrekBook 🧌</h2>

        <img
            id="current-user-avatar"
            src="/default-avatar.png"
            width="80"
            height="80"
            alt="Avatar"
        >

    </section>

    <section>

        <h2>Create a post</h2>

        <textarea
            id="post-content"
            maxlength="5000"
            placeholder="What's happening in the swamp?"
        ></textarea>

        <br>

        <button
            onclick="createPost()"
        >
            Post
        </button>

    </section>

    <section>

        <h2>Feed</h2>

        <button
            onclick="loadFeed()"
        >
            Refresh
        </button>

        <div id="feed"></div>

    </section>

    <section>

        <h2>People</h2>

        <button
            onclick="loadPeople()"
        >
            Refresh People
        </button>

        <div id="people-list"></div>

    </section>

</main>

<script src="/script.js"></script>

</body>

</html>

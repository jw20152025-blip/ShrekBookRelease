<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShrekBook 🧌</title>

    <link
        rel="stylesheet"
        href="/styles.css">
</head>

<body>

<header class="navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="logo">

            🧌 ShrekBook

        </a>


        <nav id="nav">

            <a href="/">
                Home
            </a>

            <a
                href="/profile.html"
                id="profile-link">

                Profile

            </a>

            <button
                id="logout-button"
                onclick="logout()"
                style="display:none;">

                Logout

            </button>

        </nav>

    </div>

</header>


<main class="container">

    <!-- ================================= -->
    <!-- LOGIN / SIGNUP -->
    <!-- ================================= -->
    <h1>
        Welcome to ShrekBook 🧌
    </h1>
    <section
        id="auth-section"
        class="auth-section">

        <div class="auth-box">



            <p>
                The social network for ogres,
                cats, and everyone in between.
            </p>


            <!-- LOGIN -->

            <div id="login-box">

                <h2>
                    Login
                </h2>

                <input
                    id="login-email"
                    type="email"
                    placeholder="Email">

                <input
                    id="login-password"
                    type="password"
                    placeholder="Password">

                <button
                    onclick="login()">

                    🔐 Login

                </button>

                <p id="login-status"></p>

                <button
                    class="secondary-button"
                    onclick="showSignup()">

                    Don't have an account?
                    Sign up

                </button>

            </div>


            <!-- SIGNUP -->

            <div
                id="signup-box"
                style="display:none;">

                <h2>
                    Create Account
                </h2>

                <input
                    id="signup-username"
                    type="text"
                    maxlength="30"
                    placeholder="Username">

                <input
                    id="signup-display-name"
                    type="text"
                    maxlength="50"
                    placeholder="Display name">

                <input
                    id="signup-email"
                    type="email"
                    placeholder="Email">

                <input
                    id="signup-password"
                    type="password"
                    placeholder="Password">

                <button
                    onclick="signup()">

                    📝 Create Account

                </button>

                <p id="signup-status"></p>

                <button
                    class="secondary-button"
                    onclick="showLogin()">

                    Already have an account?
                    Login

                </button>

            </div>

        </div>

    </section>


    <!-- ================================= -->
    <!-- APP -->
    <!-- ================================= -->

    <section
        id="app-section"
        style="display:none;">


        <!-- CREATE POST -->

        <section class="create-post">

            <h2>
                What's on your mind? 🧌
            </h2>

            <textarea
                id="post-content"
                maxlength="5000"
                placeholder="Say something...">
            </textarea>

            <button
                onclick="createPost()">

                📝 Post

            </button>

            <p id="post-status"></p>

        </section>


        <!-- POSTS -->

        <section>

            <h2>
                Feed
            </h2>

            <div id="posts">
                Loading posts...
            </div>

        </section>


        <!-- PEOPLE -->

        <section class="people-section">

            <h2>
                People 👥
            </h2>

            <div id="people">
                Loading people...
            </div>

        </section>

    </section>

</main>


<script>

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;
}


/* =========================================
   LOGIN
========================================= */

async function login() {

    const email =
        document.getElementById(
            "login-email"
        ).value.trim();

    const password =
        document.getElementById(
            "login-password"
        ).value;

    const status =
        document.getElementById(
            "login-status"
        );

    if (!email || !password) {

        status.textContent =
            "❌ Enter your email and password.";

        return;
    }

    status.textContent =
        "Logging in...";

    try {

        const response =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Login failed."
            );
        }

        status.textContent =
            "✅ Logged in!";

        showApp();

    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        status.textContent =
            "❌ " + error.message;
    }
}


/* =========================================
   SIGNUP
========================================= */

async function signup() {

    const username =
        document.getElementById(
            "signup-username"
        ).value.trim();

    const display_name =
        document.getElementById(
            "signup-display-name"
        ).value.trim();

    const email =
        document.getElementById(
            "signup-email"
        ).value.trim();

    const password =
        document.getElementById(
            "signup-password"
        ).value;

    const status =
        document.getElementById(
            "signup-status"
        );


    if (
        !username ||
        !email ||
        !password
    ) {

        status.textContent =
            "❌ Fill in all required fields.";

        return;
    }


    status.textContent =
        "Creating account...";


    try {

        const response =
            await fetch(
                "/api/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username,

                        display_name:
                            display_name ||
                            username,

                        email,

                        password
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Signup failed."
            );
        }


        status.textContent =
            "✅ Account created!";

        showLogin();


    } catch (error) {

        console.error(
            "SIGNUP ERROR:",
            error
        );

        status.textContent =
            "❌ " + error.message;
    }
}


/* =========================================
   AUTH UI
========================================= */

function showSignup() {

    document.getElementById(
        "login-box"
    ).style.display =
        "none";

    document.getElementById(
        "signup-box"
    ).style.display =
        "block";
}


function showLogin() {

    document.getElementById(
        "signup-box"
    ).style.display =
        "none";

    document.getElementById(
        "login-box"
    ).style.display =
        "block";
}


/* =========================================
   CHECK SESSION
========================================= */

async function checkLogin() {

    try {

        const response =
            await fetch("/api/me");

        if (!response.ok) {

            showAuth();

            return;
        }

        const data =
            await response.json();

        if (data.user) {

            showApp();

        } else {

            showAuth();
        }

    } catch {

        showAuth();

    }
}


function showAuth() {

    document.getElementById(
        "auth-section"
    ).style.display =
        "block";

    document.getElementById(
        "app-section"
    ).style.display =
        "none";

    document.getElementById(
        "logout-button"
    ).style.display =
        "none";
}


function showApp() {

    document.getElementById(
        "auth-section"
    ).style.display =
        "none";

    document.getElementById(
        "app-section"
    ).style.display =
        "block";

    document.getElementById(
        "logout-button"
    ).style.display =
        "inline-block";

    loadPosts();

    loadPeople();
}


/* =========================================
   LOGOUT
========================================= */

async function logout() {

    await fetch(
        "/api/logout",
        {
            method: "POST"
        }
    );

    showAuth();
}


/* =========================================
   POSTS
========================================= */

async function loadPosts() {

    const container =
        document.getElementById(
            "posts"
        );

    try {

        const response =
            await fetch("/api/posts");

        const posts =
            await response.json();

        if (!response.ok) {

            throw new Error(
                posts.error ||
                "Could not load posts."
            );
        }


        if (!posts.length) {

            container.innerHTML =
                "<p>No posts yet. Be the first! 🧌</p>";

            return;
        }


        container.innerHTML =
            posts.map(post => {

                const username =
                    post.username ||
                    post.profiles?.username ||
                    "User";

                const avatar =
                    post.avatar ||
                    post.profiles?.avatar ||
                    "/default-avatar.png";


                return `

                <article class="post">

                    <div class="post-header">

                        <img
                            class="avatar"
                            src="${escapeHtml(avatar)}">

                        <strong>
                            ${escapeHtml(username)}
                        </strong>

                    </div>


                    <div class="post-content">

                        ${escapeHtml(
                            post.content
                        )}

                    </div>


                    <button
                        onclick="toggleComments('${post.id}')">

                        💬 Comments

                    </button>


                    <div
                        id="comments-${post.id}"
                        class="comments"
                        style="display:none;">

                        <div
                            id="comment-list-${post.id}">

                            Loading...

                        </div>


                        <div class="comment-form">

                            <input
                                id="comment-input-${post.id}"
                                placeholder="Write a comment..."
                                maxlength="500">

                            <button
                                onclick="submitComment('${post.id}')">

                                Send

                            </button>

                        </div>

                    </div>

                </article>

                `;

            }).join("");


    } catch (error) {

        console.error(
            "POST ERROR:",
            error
        );

        container.innerHTML =
            `<p>❌ ${escapeHtml(
                error.message
            )}</p>`;
    }
}


/* =========================================
   CREATE POST
========================================= */

async function createPost() {

    const input =
        document.getElementById(
            "post-content"
        );

    const content =
        input.value.trim();

    if (!content) return;


    const response =
        await fetch(
            "/api/posts",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    content
                })
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        document.getElementById(
            "post-status"
        ).textContent =
            "❌ " +
            (data.error ||
                "Could not post.");

        return;
    }


    input.value = "";

    document.getElementById(
        "post-status"
    ).textContent =
        "✅ Posted!";


    loadPosts();
}


/* =========================================
   COMMENTS
========================================= */

async function toggleComments(postId) {

    const box =
        document.getElementById(
            `comments-${postId}`
        );

    if (!box) return;


    if (
        box.style.display ===
        "none"
    ) {

        box.style.display =
            "block";

        loadComments(postId);

    } else {

        box.style.display =
            "none";
    }
}


async function loadComments(postId) {

    const list =
        document.getElementById(
            `comment-list-${postId}`
        );

    try {

        const response =
            await fetch(
                `/api/posts/${postId}/comments`
            );

        const comments =
            await response.json();


        if (!response.ok) {

            throw new Error(
                comments.error ||
                "Could not load comments."
            );
        }


        if (!comments.length) {

            list.innerHTML =
                "<p>No comments yet 😼</p>";

            return;
        }


        list.innerHTML =
            comments.map(comment => `

                <div class="comment">

                    <strong>
                        ${escapeHtml(
                            comment.username ||
                            "User"
                        )}
                    </strong>

                    <p>
                        ${escapeHtml(
                            comment.content
                        )}
                    </p>

                </div>

            `).join("");


    } catch (error) {

        console.error(
            "COMMENTS ERROR:",
            error
        );

        list.innerHTML =
            `<p>❌ ${escapeHtml(
                error.message
            )}</p>`;
    }
}


async function submitComment(postId) {

    const input =
        document.getElementById(
            `comment-input-${postId}`
        );

    const content =
        input.value.trim();

    if (!content) return;


    try {

        const response =
            await fetch(
                `/api/posts/${postId}/comments`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        content
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not comment."
            );
        }


        input.value = "";

        loadComments(postId);


    } catch (error) {

        alert(
            "❌ " + error.message
        );
    }
}


/* =========================================
   PEOPLE
========================================= */

async function loadPeople() {

    const container =
        document.getElementById(
            "people"
        );

    try {

        const response =
            await fetch(
                "/api/users"
            );

        const users =
            await response.json();


        if (!response.ok) {

            throw new Error(
                users.error ||
                "Could not load people."
            );
        }


        container.innerHTML =
            users.map(user => `

                <div class="person">

                    <img
                        class="avatar"
                        src="${escapeHtml(
                            user.avatar ||
                            "/default-avatar.png"
                        )}">

                    <div>

                        <strong>
                            ${escapeHtml(
                                user.display_name ||
                                user.username
                            )}
                        </strong>

                        <p>
                            @${escapeHtml(
                                user.username
                            )}
                        </p>

                    </div>

                </div>

            `).join("");


    } catch (error) {

        container.innerHTML =
            `<p>❌ ${escapeHtml(
                error.message
            )}</p>`;
    }
}


/* =========================================
   START
========================================= */

checkLogin();

</script>

</body>
</html>

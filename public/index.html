</header>

<div class="container">


<div class="welcome">

    <h2>Welcome to ShrekBook!</h2>

    <p>
        The social network for absolutely normal people.
    </p>

</div>

<h2>People</h2>

<div id="people">
    Loading people...
</div>


</div>

<script>

async function loadPeople() {

    const container =
        document.getElementById("people");

    try {

        const response =
            await fetch("/api/users");

        const users =
            await response.json();

        container.innerHTML = "";

        if (users.length === 0) {
            container.innerHTML =
                "<p>No people have joined yet.</p>";
            return;
        }

        users.forEach(user => {

            const person =
                document.createElement("div");

            person.className = "person";

            person.innerHTML = `
                <img
                    src="${user.avatar}"
                    alt="Avatar"
                >

                <h3>
                    ${user.displayName}
                </h3>

                <p>
                    @${user.username}
                </p>

                <a href="/profile.html?id=${user.id}">
                    View Profile
                </a>
            `;

            container.appendChild(person);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Could not load people.</p>";
    }
}

loadPeople();

</script>

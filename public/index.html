
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <a
            href="/"
            class="logo"
        >
            🧌 ShrekBook
        </a>


        <nav
            class="nav"
            id="main-nav"
        >

            <a href="/">
                Home
            </a>

            <a href="/chat.html">
                💬 ShrekChat
            </a>

            <a
                href="/login.html"
                id="login-nav"
            >
                Log In
            </a>

            <a
                href="/profile.html"
                id="profile-nav"
                style="display:none;"
            >
                👤 Profile
            </a>

            <button
                id="logout-button"
                style="display:none;"
            >
                Log Out
            </button>

        </nav>

    </div>

</header>



<main class="container">


    <!-- WELCOME -->

    <section
        class="card"
        id="welcome-card"
    >

        <h1
            class="page-title"
            style="margin-bottom:6px;"
        >
            Welcome to ShrekBook 🧌
        </h1>

        <div
            id="welcome-text"
            style="font-size:18px;"
        >
            Loading your swamp status...
        </div>

    </section>



    <!-- CREATE POST -->

    <section
        class="card"
        id="create-post"
        style="display:none;"
    >

        <h2>
            What's happening?
        </h2>


        <textarea
            id="post-content"
            placeholder="Post something..."
            style="
                width:100%;
                min-height:110px;
                resize:vertical;
                padding:13px;
                border:1px solid var(--border);
                border-radius:10px;
                font-family:inherit;
                font-size:17px;
            "
        ></textarea>


        <div
            style="
                display:flex;
                justify-content:flex-end;
                margin-top:10px;
            "
        >

            <button
                id="post-button"
                class="primary-button"
            >
                📝 Post
            </button>

        </div>


        <div
            id="post-message"
            style="
                margin-top:10px;
                font-weight:800;
            "
        ></div>

    </section>



    <!-- PEOPLE -->

    <section>

        <h2
            class="page-title"
            style="font-size:27px;"
        >
            👥 People
        </h2>


        <div
            id="people"
            class="people-grid"
        >

            <div class="loading">
                Loading people...
            </div>

        </div>

    </section>



    <!-- POSTS -->

    <section
        style="margin-top:30px;"
    >

        <h2
            class="page-title"
            style="font-size:27px;"
        >
            📝 Posts
        </h2>


        <div
            id="posts"
        >

            <div class="loading">
                Loading posts...
            </div>

        </div>

    </section>


</main>



<script src="/script.js"></script>

</body>

</html>

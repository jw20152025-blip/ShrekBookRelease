<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #6b8e23;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .profile-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .home-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        #people-list {
            display: grid;
            gap: 12px;
        }

        .person {
            background: white;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .person:hover {
            background: #eeeeee;
        }

        .person-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
        }

        .person-info {
            display: flex;
            flex-direction: column;
        }

        .person-info span {
            color: #777;
        }

        button {
            cursor: pointer;
            padding: 8px 14px;
            border: none;
            border-radius: 7px;
        }

    </style>

</head>


<body>

    <header>

        <h1>🧌 ShrekBook</h1>

        <button
            onclick="logout()"
        >
            Log out
        </button>

    </header>


    <main>

        <section class="profile-card">

            <img
                id="home-avatar"
                class="home-avatar"
                src="/default-avatar.png"
                alt="Avatar"
            >

            <h2 id="home-display-name">
                Loading...
            </h2>

            <p id="home-username">
                @loading
            </p>

        </section>


        <section>

            <h2>
                People
            </h2>

            <div
                id="people-list"
            >
                Loading people...
            </div>

        </section>

    </main>


    <!-- SHARED -->
    <script
        src="/js/script.js"
    ></script>


    <!-- HOME -->
    <script
        src="/js/home.js"
    ></script>

</body>

</html>

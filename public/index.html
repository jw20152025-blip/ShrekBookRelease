<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >

</head>

<body>

<header>

    <div class="brand">

        <div class="logo">
            🧌
        </div>

        <h1>
            ShrekBook
        </h1>

    </div>


    <nav>

        <a href="/">
            Home
        </a>

        <a
            href="/login.html"
            id="loginLink"
        >
            Login
        </a>

        <a
            href="/signup.html"
            id="signupLink"
        >
            Sign Up
        </a>

        <button
            id="logoutButton"
            onclick="logout()"
            style="display:none;"
        >
            Logout
        </button>

    </nav>

</header>


<main class="container">


    <section class="welcome">

        <h2>
            Welcome to ShrekBook 🧌
        </h2>

        <p id="loginStatus">
            Loading...
        </p>

    </section>


    <section
        id="createPostSection"
        style="display:none;"
    >

        <h2>
            Create a Post
        </h2>

        <textarea
            id="postContent"
            placeholder="What's on your mind?"
        ></textarea>

        <button
            onclick="createPost()"
        >
            Post 🧌
        </button>

    </section>


    <section>

        <h2>
            📝 Posts
        </h2>

        <div id="posts">
            Loading posts...
        </div>

    </section>


    <section>

        <h2>
            👥 People
        </h2>

        <div id="people">
            Loading people...
        </div>

    </section>

</main>


<script src="/script.js"></script>

</body>

</html>

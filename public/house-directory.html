<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Room</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101114;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #17191f;
            border-bottom: 1px solid #292c35;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #292d37;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #363b48;
        }

        .chat {
            height: calc(100vh - 64px);
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .name {
            font-weight: bold;
        }

        .time {
            color: #777e89;
            font-size: 12px;
            margin-left: 8px;
        }

        .content {
            margin-top: 4px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #292c35;
        }

        input {
            flex: 1;
            border: 1px solid #30343e;
            border-radius: 8px;
            background: #20232a;
            color: white;
            padding: 12px;
            outline: none;
        }

        .call-panel {
            position: fixed;
            right: 20px;
            bottom: 80px;
            width: 320px;
            padding: 16px;
            border-radius: 14px;
            background: #1a1d24;
            border: 1px solid #343844;
            display: none;
        }

        .call-panel.show {
            display: block;
        }

        .call-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .call-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #participants {
            margin-top: 14px;
            color: #a1a6b0;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <div>
        <strong id="roomName">
            Loading...
        </strong>
    </div>

    <div>
        <button onclick="startVoice()">
            🎤 Start Voice
        </button>

        <button onclick="location.href='/house.html?id=' + houseId">
            ← House
        </button>
    </div>
</header>

<div class="chat">

    <div id="messages"></div>

    <form class="composer" id="messageForm">

        <input
            id="messageInput"
            maxlength="4000"
            autocomplete="off"
            placeholder="Message..."
        >

        <button>
            Send
        </button>

    </form>

</div>

<div class="call-panel" id="callPanel">

    <div class="call-title">
        🎤 House Voice
    </div>

    <div class="call-buttons">

        <button onclick="muteMicrophone()">
            🎙️ Mute
        </button>

        <button onclick="leaveVoice()">
            📞 Leave
        </button>

        <button onclick="endVoice()">
            🛑 End
        </button>

    </div>

    <div id="participants">
        Connecting...
    </div>

    <audio id="remoteAudio" autoplay></audio>

</div>

<script>
    const params =
        new URLSearchParams(location.search);

    const houseId =
        params.get("house");

    const roomId =
        params.get("room");

    let currentCall = null;

    let localStream = null;

    let peerConnections = {};

    let signalCursor = 0;

    let signalTimer = null;

    let messageTimer = null;

    let muted = false;

    async function api(url, options = {}) {
        const response =
            await fetch(url, {
                credentials: "include",
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

        const data =
            await response.json()
                .catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Request failed."
            );
        }

        return data;
    }

    async function loadRoom() {
        const data =
            await api(
                `/api/houses/${houseId}`
            );

        const room =
            data.rooms.find(
                r =>
                    String(r.id) ===
                    String(roomId)
            );

        if (!room) {
            throw new Error(
                "Room not found."
            );
        }

        document.getElementById(
            "roomName"
        ).textContent =
            `${room.room_type === "voice" ? "🎤" : "💬"} ${room.name}`;

        await loadMessages();

        messageTimer =
            setInterval(
                loadMessages,
                2500
            );
    }

    async function loadMessages() {
        try {
            const data =
                await api(
                    `/api/houses/${houseId}/rooms/${roomId}/messages`
                );

            const container =
                document.getElementById(
                    "messages"
                );

            const atBottom =
                container.scrollHeight -
                container.scrollTop -
                container.clientHeight <
                100;

            container.innerHTML = "";

            for (const message of data.messages) {
                const wrapper =
                    document.createElement("div");

                wrapper.className =
                    "message";

                const avatar =
                    document.createElement("img");

                avatar.className =
                    "avatar";

                avatar.src =
                    message.profile?.avatar ||
                    "/default-avatar.png";

                const body =
                    document.createElement("div");

                const header =
                    document.createElement("div");

                const name =
                    document.createElement("span");

                name.className =
                    "name";

                name.textContent =
                    message.profile?.display_name ||
                    message.profile?.username ||
                    "Unknown";

                const time =
                    document.createElement("span");

                time.className =
                    "time";

                time.textContent =
                    new Date(
                        message.created_at
                    ).toLocaleString();

                const content =
                    document.createElement("div");

                content.className =
                    "content";

                content.textContent =
                    message.content;

                header.appendChild(name);
                header.appendChild(time);

                body.appendChild(header);
                body.appendChild(content);

                wrapper.appendChild(avatar);
                wrapper.appendChild(body);

                container.appendChild(wrapper);
            }

            if (atBottom) {
                container.scrollTop =
                    container.scrollHeight;
            }

        } catch (error) {
            console.error(error);
        }
    }

    document.getElementById(
        "messageForm"
    ).addEventListener(
        "submit",
        async event => {
            event.preventDefault();

            const input =
                document.getElementById(
                    "messageInput"
                );

            const content =
                input.value.trim();

            if (!content) return;

            try {
                await api(
                    `/api/houses/${houseId}/rooms/${roomId}/messages`,
                    {
                        method: "POST",
                        body: JSON.stringify({
                            content
                        })
                    }
                );

                input.value = "";

                await loadMessages();

            } catch (error) {
                alert(error.message);
            }
        }
    );

    // ========================================================
    // WEBRTC
    // ========================================================

    async function startVoice() {
        try {
            if (currentCall) {
                return;
            }

            const data =
                await api(
                    `/api/houses/${houseId}/rooms/${roomId}/calls`,
                    {
                        method: "POST",
                        body: JSON.stringify({
                            call_type: "voice"
                        })
                    }
                );

            currentCall =
                data.call;

            await joinCall();

        } catch (error) {
            alert(error.message);
        }
    }

    async function joinCall() {
        if (!currentCall) {
            return;
        }

        await api(
            `/api/houses/calls/${currentCall.id}/join`,
            {
                method: "POST"
            }
        );

        localStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });

        document.getElementById(
            "callPanel"
        ).classList.add("show");

        document.getElementById(
            "participants"
        ).textContent =
            "🎤 Voice connected";

        startSignalPolling();
    }

    function startSignalPolling() {
        clearInterval(signalTimer);

        signalTimer =
            setInterval(
                pollSignals,
                800
            );

        pollSignals();
    }

    async function pollSignals() {
        if (!currentCall) return;

        try {
            const data =
                await api(
                    `/api/houses/calls/${currentCall.id}/signals?after=${signalCursor}`
                );

            for (const signal of data.signals) {
                signalCursor =
                    Math.max(
                        signalCursor,
                        Number(signal.id)
                    );

                await handleSignal(signal);
            }

        } catch (error) {
            console.error(error);
        }
    }

    async function handleSignal(signal) {
        const senderId =
            signal.sender_id;

        if (!peerConnections[senderId]) {
            createPeerConnection(senderId);
        }

        const peer =
            peerConnections[senderId];

        if (
            signal.signal_type ===
            "offer"
        ) {
            await peer.setRemoteDescription(
                new RTCSessionDescription(
                    signal.signal_data
                )
            );

            const answer =
                await peer.createAnswer();

            await peer.setLocalDescription(
                answer
            );

            await sendSignal(
                "answer",
                answer,
                senderId
            );
        }

        if (
            signal.signal_type ===
            "answer"
        ) {
            await peer.setRemoteDescription(
                new RTCSessionDescription(
                    signal.signal_data
                )
            );
        }

        if (
            signal.signal_type ===
            "ice-candidate"
        ) {
            try {
                await peer.addIceCandidate(
                    new RTCIceCandidate(
                        signal.signal_data
                    )
                );
            } catch (error) {
                console.error(error);
            }
        }
    }

    function createPeerConnection(userId) {
        const peer =
            new RTCPeerConnection({
                iceServers: [
                    {
                        urls:
                            "stun:stun.l.google.com:19302"
                    }
                ]
            });

        peerConnections[userId] =
            peer;

        for (const track of localStream.getTracks()) {
            peer.addTrack(
                track,
                localStream
            );
        }

        peer.onicecandidate =
            async event => {
                if (!event.candidate) {
                    return;
                }

                await sendSignal(
                    "ice-candidate",
                    event.candidate,
                    userId
                );
            };

        peer.ontrack =
            event => {
                const audio =
                    document.getElementById(
                        "remoteAudio"
                    );

                audio.srcObject =
                    event.streams[0];
            };

        peer.onconnectionstatechange =
            () => {
                if (
                    ["failed", "closed"]
                        .includes(
                            peer.connectionState
                        )
                ) {
                    delete peerConnections[userId];
                }
            };

        return peer;
    }

    async function sendSignal(
        signalType,
        signalData,
        recipientId = null
    ) {
        await api(
            `/api/houses/calls/${currentCall.id}/signals`,
            {
                method: "POST",
                body: JSON.stringify({
                    signal_type:
                        signalType,
                    signal_data:
                        signalData,
                    recipient_id:
                        recipientId
                })
            }
        );
    }

    function muteMicrophone() {
        if (!localStream) return;

        muted = !muted;

        for (
            const track
            of localStream.getAudioTracks()
        ) {
            track.enabled =
                !muted;
        }
    }

    async function leaveVoice() {
        if (!currentCall) {
            return;
        }

        try {
            await api(
                `/api/houses/calls/${currentCall.id}/leave`,
                {
                    method: "POST"
                }
            );
        } catch (error) {
            console.error(error);
        }

        cleanupVoice();
    }

    async function endVoice() {
        if (!currentCall) {
            return;
        }

        try {
            await api(
                `/api/houses/calls/${currentCall.id}/end`,
                {
                    method: "POST"
                }
            );
        } catch (error) {
            alert(error.message);
        }

        cleanupVoice();
    }

    function cleanupVoice() {
        clearInterval(signalTimer);

        for (
            const peer
            of Object.values(
                peerConnections
            )
        ) {
            peer.close();
        }

        peerConnections = {};

        if (localStream) {
            for (
                const track
                of localStream.getTracks()
            ) {
                track.stop();
            }
        }

        localStream = null;
        currentCall = null;

        document.getElementById(
            "callPanel"
        ).classList.remove("show");
    }

    loadRoom()
        .catch(error => {
            alert(error.message);
            location.href =
                `/house.html?id=${houseId}`;
        });
</script>

</body>
</html>

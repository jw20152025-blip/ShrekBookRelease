<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook Houses</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5ef;
        }

        header {
            padding: 20px;
            background: #304d2c;
            color: white;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input,
        textarea,
        select,
        button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
        }

        .houses {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .house {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow:
                0 3px 12px rgba(0,0,0,.08);
        }

        .house h2 {
            margin-top: 0;
        }

        .house button {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏠 ShrekBook Houses</h1>
</header>

<main>

    <div class="search">
        <input
            id="search"
            type="text"
            placeholder="Search houses..."
        >

        <button onclick="loadHouses()">
            Search
        </button>

        <button
            onclick="location.href='house-create.html'"
        >
            Create House
        </button>

        <button
            onclick="location.href='house-invitations.html'"
        >
            Invitations
        </button>
    </div>

    <div
        id="houses"
        class="houses"
    ></div>

</main>

<script>
async function loadHouses() {

    const search =
        encodeURIComponent(
            document.getElementById("search").value
        );

    const response = await fetch(
        `/api/houses?search=${search}`
    );

    const data = await response.json();

    const container =
        document.getElementById("houses");

    if (!response.ok) {
        container.innerHTML =
            `<p>${escapeHtml(data.error || "Failed.")}</p>`;

        return;
    }

    container.innerHTML = "";

    for (const house of data.houses) {

        const card =
            document.createElement("div");

        card.className = "house";

        card.innerHTML = `
            <h2>${escapeHtml(house.name)}</h2>

            <p>
                ${escapeHtml(
                    house.description || ""
                )}
            </p>

            <p>
                🏰 ${escapeHtml(
                    house.house_types?.name || "House"
                )}
            </p>

            <p>
                👥 ${house.memberCount} members
            </p>

            <button
                onclick="openHouse(${house.id})"
            >
                Enter House
            </button>
        `;

        container.appendChild(card);
    }

    if (!data.houses.length) {
        container.innerHTML =
            "<p>No houses found.</p>";
    }
}

function openHouse(id) {
    location.href = `house.html?id=${id}`;
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

loadHouses();
</script>

</body>
</html>

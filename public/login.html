<main class="container">

<section class="form-box">

</div>

    <form id="loginForm">

        <label>

        <input
            id="email"
            type="email"
            required
        >


        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="loginMessage"></p>

</section>

</main>



<script>

document
    .getElementById("loginForm")

    .addEventListener("submit", async (event) => {

    form.addEventListener(
        "submit",
        async event => {


            event.preventDefault();


        const message =
            document.getElementById("message");

        message.textContent =
            "Logging in...";

        try {

            const response = await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email:
                            document.getElementById(
                                "email"
                            ).value,

                        password:
                            document.getElementById(
                                "password"
                            ).value

                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok) {

                message.textContent =
                    data.error ||
                    "Login failed.";

                return;

            }

            localStorage.setItem(
                "shrekbook_token",
                data.access_token
            );

            message.textContent =
                "Logged in! 🧌";

            setTimeout(() => {

                window.location.href =
                    "/";

            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong.";

        }

    });


            const email =
                document.getElementById(
                    "email"
                ).value;


            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            message.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        "/api/login",
                        {

                            method: "POST",

                            credentials:
                                "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    email,

                                    password

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Login failed."
                    );

                }


                window.location.href =
                    "/";


            } catch (error) {

                message.textContent =
                    "❌ " +
                    error.message;

            }

        }
    );


</script>

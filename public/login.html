<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">
    <
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShrekBook</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

<header>

    <h1>🧌 ShrekBook</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/signup.html">
            Create Account
        </a>
    </nav>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <p>
            Don't have an account?

            <a href="/signup.html">
                Create one
            </a>
        </p>

    </div>

</main>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value;


            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "message"
                );


            const response =
                await fetch(
                    "/api/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email,
                            password

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.error ||
                    "Login failed.";

                return;
            }


            localStorage.setItem(
                "shrekbook_user_id",
                data.user.id
            );


            localStorage.setItem(
                "shrekbook_token",
                data.access_token
            );


            window.location.href =
                "/";

        }
    );

</script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In — ShrekBook</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-title">
            🧌 ShrekBook
        </div>

        <div class="auth-subtitle">
            Welcome back to the swamp.
        </div>


        <form
            id="login-form"
        >

            <div class="auth-field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Your password"
                    required
                >

            </div>


            <button
                id="login-button"
                type="submit"
                class="primary-button"
                style="width:100%;"
            >
                🧌 Log In
            </button>


            <div
                id="login-message"
                class="auth-error"
            ></div>

        </form>


        <div
            style="
                text-align:center;
                margin-top:20px;
                font-size:16px;
            "
        >

            Don't have an account?

            <a href="/signup.html">
                Sign up
            </a>

        </div>


        <div
            style="
                text-align:center;
                margin-top:12px;
            "
        >

            <a href="/">
                ← Back to ShrekBook
            </a>

        </div>

    </section>

</main>


<script src="/login.js"></script>

</body>

</html>

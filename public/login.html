
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="styles.css">

    <title>Login - ShrekBook</title>

</head>

<body>

<header>

    <div class="brand">
        <h1>🧌 ShrekBook</h1>
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/signup.html">
            Create Account
        </a>

    </nav>

</header>


<div class="container">

    <div class="welcome">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const message =
            document.getElementById("message");

        message.textContent =
            "Logging in...";

        try {

            const response = await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email:
                            document.getElementById(
                                "email"
                            ).value,

                        password:
                            document.getElementById(
                                "password"
                            ).value

                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok) {

                message.textContent =
                    data.error ||
                    "Login failed.";

                return;

            }

            localStorage.setItem(
                "shrekbook_token",
                data.access_token
            );

            message.textContent =
                "Logged in! 🧌";

            setTimeout(() => {

                window.location.href =
                    "/";

            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong.";

        }

    });

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ShrekBook 🧌</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header class="navbar">
    <div class="navbar-inner">

        <a href="/" class="logo">
            🧌 ShrekBook
        </a>

        <nav>
            <a href="/">Home</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="auth-section">

        <!-- ========================= -->
        <!-- LOGIN UI -->
        <!-- ========================= -->

        <div class="auth-box" id="loginBox">

            <h1>Welcome Back 🧌</h1>

            <p>
                Log back into ShrekBook.
            </p>

            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button onclick="login()">
                🔐 Login
            </button>

            <p id="status"></p>

            <p>
                Don't have an account?
                <a href="#" onclick="showSignup(); return false;">
                    Create one
                </a>
            </p>

        </div>


        <!-- ========================= -->
        <!-- SIGNUP UI -->
        <!-- ========================= -->

        <div
            class="auth-box"
            id="signupBox"
            style="display: none;"
        >

            <h1>Create Account 🧌</h1>

            <p>
                Join ShrekBook!
            </p>

            <input
                id="signupUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="signupEmail"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <input
                id="signupPasswordConfirm"
                type="password"
                placeholder="Confirm Password"
                autocomplete="new-password"
            >

            <button onclick="signup()">
                🧌 Create Account
            </button>

            <p id="signupStatus"></p>

            <p>
                Already have an account?
                <a href="#" onclick="showLogin(); return false;">
                    Log in
                </a>
            </p>

        </div>

    </section>

</main>


<script>

/* ==================================================
   SHOW LOGIN
================================================== */

function showLogin() {

    document.getElementById("loginBox")
        .style.display = "block";

    document.getElementById("signupBox")
        .style.display = "none";
}


/* ==================================================
   SHOW SIGNUP
================================================== */

function showSignup() {

    document.getElementById("loginBox")
        .style.display = "none";

    document.getElementById("signupBox")
        .style.display = "block";
}


/* ==================================================
   LOGIN
================================================== */

async function login() {

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;

    const status =
        document.getElementById("status");


    if (!email || !password) {

        status.textContent =
            "❌ Enter your email and password.";

        return;
    }


    status.textContent =
        "Logging in...";


    try {

        const response =
            await fetch("/api/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Login failed."
            );

        }


        status.textContent =
            "✅ Login successful!";


        window.location.href = "/";


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        status.textContent =
            "❌ " + error.message;

    }

}

/* ==================================================
   SHOW SIGNUP UI
================================================== */

function showSignup() {

    const loginBox =
        document.getElementById("loginBox");

    const signupBox =
        document.getElementById("signupBox");


    if (!loginBox || !signupBox) {
        console.error(
            "❌ Login or signup box not found."
        );
        return;
    }


    // Hide login
    loginBox.style.display = "none";


    // Show signup
    signupBox.style.display = "block";


    // Change page title
    document.title =
        "Sign Up - ShrekBook 🧌";


    // Clear old login status
    const loginStatus =
        document.getElementById("status");

    if (loginStatus) {
        loginStatus.textContent = "";
    }


    // Focus username field
    const username =
        document.getElementById("signupUsername");

    if (username) {
        setTimeout(() => {
            username.focus();
        }, 50);
    }
}


/* ==================================================
   SHOW LOGIN UI
================================================== */

function showLogin() {

    const loginBox =
        document.getElementById("loginBox");

    const signupBox =
        document.getElementById("signupBox");


    if (!loginBox || !signupBox) {
        console.error(
            "❌ Login or signup box not found."
        );
        return;
    }


    // Hide signup
    signupBox.style.display = "none";


    // Show login
    loginBox.style.display = "block";


    // Change page title
    document.title =
        "Login - ShrekBook 🧌";


    // Clear old signup status
    const signupStatus =
        document.getElementById("signupStatus");

    if (signupStatus) {
        signupStatus.textContent = "";
    }


    // Focus email field
    const email =
        document.getElementById("email");

    if (email) {
        setTimeout(() => {
            email.focus();
        }, 50);
    }
}


/* ==================================================
   OPTIONAL:
   ALLOW ?signup IN URL
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const params =
            new URLSearchParams(
                window.location.search
            );


        if (
            params.get("signup") === "true" ||
            params.get("signup") === "1"
        ) {

            showSignup();

        } else {

            showLogin();

        }

    }
);

/* ==================================================
   SIGNUP
================================================== */

async function signup() {

    const username =
        document.getElementById("signupUsername")
            .value.trim();

    const email =
        document.getElementById("signupEmail")
            .value.trim();

    const password =
        document.getElementById("signupPassword")
            .value;

    const confirmPassword =
        document.getElementById("signupPasswordConfirm")
            .value;

    const status =
        document.getElementById("signupStatus");


    if (!username || !email || !password) {

        status.textContent =
            "❌ Please fill in all fields.";

        return;
    }


    if (password !== confirmPassword) {

        status.textContent =
            "❌ Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        status.textContent =
            "❌ Password must be at least 6 characters.";

        return;
    }


    status.textContent =
        "Creating account...";


    try {

        const response =
            await fetch("/api/signup", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    username,
                    email,
                    password

                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Signup failed."
            );

        }


        status.textContent =
            "✅ Account created!";


        /*
         * Automatically show the login UI
         * after successful signup.
         */

        setTimeout(() => {

            showLogin();

            document.getElementById("email")
                .value = email;

        }, 1000);


    } catch (error) {

        console.error(
            "SIGNUP ERROR:",
            error
        );

        status.textContent =
            "❌ " + error.message;

    }

}

</script>

</body>
</html>

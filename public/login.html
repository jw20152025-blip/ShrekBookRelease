<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShrekBook</title>

</head>

<body>

<main>

    <h1>🧌 ShrekBook</h1>

    <h2>Login</h2>

    <input
        id="login-email"
        type="email"
        placeholder="Email"
        autocomplete="email"
    >

    <br><br>

    <input
        id="login-password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <br><br>

    <button
        id="login-button"
        type="button"
        onclick="login()"
    >
        Login
    </button>

    <p>
        Don't have an account?
        <a href="/signup.html">
            Sign up
        </a>
    </p>

</main>

<script src="/script.js"></script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In — ShrekBook</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>


<body>

<header class="site-header">

    <div class="header-inner">

        <a
            href="/"
            class="logo"
        >
            🧌 ShrekBook
        </a>

        <nav class="nav">

            <a href="/">
                Home
            </a>

            <a href="/signup.html">
                Sign Up
            </a>

        </nav>

    </div>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>
            Welcome back 🧌
        </h1>

        <p class="auth-subtitle">
            Log into your ShrekBook account.
        </p>


        <form
            id="login-form"
            autocomplete="on"
        >

            <label for="username">
                Email or Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="Email or username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Password"
                required
            >


            <button
                id="login-button"
                type="submit"
            >
                Log In
            </button>

        </form>


        <div
            id="login-message"
            class="auth-message"
        ></div>


        <p class="auth-footer">

            Don't have an account?

            <a href="/signup.html">
                Create one
            </a>

        </p>

    </div>

</main>


<script src="/login.js"></script>

</body>

</html>

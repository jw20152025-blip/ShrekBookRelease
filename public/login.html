<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShrekBook</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >

</head>

<body>

<header>

    <div class="brand">

        <div class="logo">
            🧌
        </div>

        <h1>
            ShrekBook
        </h1>

    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/signup.html">
            Sign Up
        </a>

    </nav>

</header>


<main class="container">

<section class="form-box">

    <h2>
        Login
    </h2>


    <form id="loginForm">

        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            required
        >


        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="loginMessage"></p>

</section>

</main>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value;


            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            message.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        "/api/login",
                        {

                            method: "POST",

                            credentials:
                                "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    email,

                                    password

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Login failed."
                    );

                }


                window.location.href =
                    "/";


            } catch (error) {

                message.textContent =
                    "❌ " +
                    error.message;

            }

        }
    );

</script>

</body>

</html>

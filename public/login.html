<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ShrekBook 🧌</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<header class="navbar">
    <div class="navbar-inner">

        <a href="/" class="logo">
            🧌 ShrekBook
        </a>

        <nav>
            <a href="/">Home</a>
        </nav>

    </div>
</header>


<main class="container">

    <section class="auth-section">

        <!-- =========================================
             LOGIN
        ========================================== -->

        <div class="auth-box" id="loginBox">

            <h1>Welcome Back 🧌</h1>

            <p>
                Log back into ShrekBook.
            </p>

            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button type="button" onclick="window.login()">
                🔐 Login
            </button>

            <p id="status"></p>

            <p>
                Don't have an account?
                <a
                    href="#"
                    onclick="window.showSignup(); return false;"
                >
                    Create one
                </a>
            </p>

        </div>


        <!-- =========================================
             SIGNUP
        ========================================== -->

        <div
            class="auth-box"
            id="signupBox"
            style="display: none;"
        >

            <h1>Create Account 🧌</h1>

            <p>
                Join ShrekBook!
            </p>

            <input
                id="signupUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="signupEmail"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <input
                id="signupPasswordConfirm"
                type="password"
                placeholder="Confirm Password"
                autocomplete="new-password"
            >

            <button type="button" onclick="window.signup()">
                🧌 Create Account
            </button>

            <p id="signupStatus"></p>

            <p>
                Already have an account?
                <a
                    href="#"
                    onclick="window.showLogin(); return false;"
                >
                    Log in
                </a>
            </p>

        </div>

    </section>

</main>


<script>

/* ==================================================
   SHOW SIGNUP
================================================== */

window.showSignup = function () {

    console.log("🧌 Switching to signup UI...");

    const loginBox =
        document.getElementById("loginBox");

    const signupBox =
        document.getElementById("signupBox");


    if (!loginBox || !signupBox) {

        console.error(
            "❌ loginBox or signupBox was not found."
        );

        return;
    }


    loginBox.style.display = "none";
    signupBox.style.display = "block";


    document.title =
        "Sign Up - ShrekBook 🧌";


    const loginStatus =
        document.getElementById("status");

    if (loginStatus) {
        loginStatus.textContent = "";
    }


    const signupStatus =
        document.getElementById("signupStatus");

    if (signupStatus) {
        signupStatus.textContent = "";
    }


    const username =
        document.getElementById("signupUsername");

    if (username) {

        setTimeout(() => {
            username.focus();
        }, 50);

    }

};


/* ==================================================
   SHOW LOGIN
================================================== */

window.showLogin = function () {

    console.log("🧌 Switching to login UI...");

    const loginBox =
        document.getElementById("loginBox");

    const signupBox =
        document.getElementById("signupBox");


    if (!loginBox || !signupBox) {

        console.error(
            "❌ loginBox or signupBox was not found."
        );

        return;
    }


    signupBox.style.display = "none";
    loginBox.style.display = "block";


    document.title =
        "Login - ShrekBook 🧌";


    const signupStatus =
        document.getElementById("signupStatus");

    if (signupStatus) {
        signupStatus.textContent = "";
    }


    const email =
        document.getElementById("email");

    if (email) {

        setTimeout(() => {
            email.focus();
        }, 50);

    }

};


/* ==================================================
   LOGIN
================================================== */

window.login = async function () {

    const email =
        document.getElementById("email")
            ?.value
            .trim();

    const password =
        document.getElementById("password")
            ?.value;

    const status =
        document.getElementById("status");


    if (!status) {
        return;
    }


    if (!email || !password) {

        status.textContent =
            "❌ Enter your email and password.";

        return;
    }


    status.textContent =
        "Logging in...";


    try {

        const response =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );


        let data = {};

        try {
            data = await response.json();
        }

        catch {
            data = {};
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Login failed."
            );

        }


        status.textContent =
            "✅ Login successful!";


        window.location.href =
            "/";

    }

    catch (error) {

        console.error(
            "❌ LOGIN ERROR:",
            error
        );

        status.textContent =
            "❌ " + error.message;

    }

};


/* ==================================================
   SIGNUP
================================================== */

window.signup = async function () {

    const username =
        document.getElementById("signupUsername")
            ?.value
            .trim();

    const email =
        document.getElementById("signupEmail")
            ?.value
            .trim();

    const password =
        document.getElementById("signupPassword")
            ?.value;

    const confirmPassword =
        document.getElementById("signupPasswordConfirm")
            ?.value;

    const status =
        document.getElementById("signupStatus");


    if (!status) {
        return;
    }


    if (
        !username ||
        !email ||
        !password ||
        !confirmPassword
    ) {

        status.textContent =
            "❌ Please fill in all fields.";

        return;
    }


    if (password !== confirmPassword) {

        status.textContent =
            "❌ Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        status.textContent =
            "❌ Password must be at least 6 characters.";

        return;
    }


    status.textContent =
        "Creating account...";


    try {

        const response =
            await fetch(
                "/api/signup",
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        username,
                        email,
                        password

                    })
                }
            );


        let data = {};

        try {
            data = await response.json();
        }

        catch {
            data = {};
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Signup failed."
            );

        }


        console.log(
            "✅ SIGNUP SUCCESS:",
            data
        );


        status.textContent =
            "✅ Account created!";


        /*
         * Switch back to login
         * after one second.
         */

        setTimeout(() => {

            window.showLogin();


            const loginEmail =
                document.getElementById("email");


            if (loginEmail) {

                loginEmail.value =
                    email;

            }

        }, 1000);

    }

    catch (error) {

        console.error(
            "❌ SIGNUP ERROR:",
            error
        );

        status.textContent =
            "❌ " + error.message;

    }

};


/* ==================================================
   URL ?signup=true SUPPORT
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "🧌 Login page JavaScript loaded."
        );


        const params =
            new URLSearchParams(
                window.location.search
            );


        if (
            params.get("signup") === "true" ||
            params.get("signup") === "1"
        ) {

            window.showSignup();

        }

        else {

            window.showLogin();

        }

    }
);

</script>

</body>
</html>

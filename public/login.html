<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShrekBook</title>

</head>


<body>

    <h1>
        🧌 ShrekBook
    </h1>

    <h2>
        Login
    </h2>


    <form
        id="login-form"
        onsubmit="
            event.preventDefault();
            login();
        "
    >

        <label>
            Email
        </label>

        <input
            id="login-email"
            type="email"
            required
        >


        <br><br>


        <label>
            Password
        </label>

        <input
            id="login-password"
            type="password"
            required
        >


        <br><br>


        <button
            type="submit"
        >
            Login
        </button>

    </form>


    <p>
        Don't have an account?
        <a href="/signup.html">
            Sign up
        </a>
    </p>


    <script
        src="/js/script.js"
    ></script>

</body>

</html>

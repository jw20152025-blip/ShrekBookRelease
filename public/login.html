<script>

/* ==================================================
   SHREKBOOK AUTH
================================================== */


/* ==================================================
   SHOW LOGIN
================================================== */

function showLogin() {

    const loginBox =
        document.getElementById("loginBox");

    const signupBox =
        document.getElementById("signupBox");

    if (!loginBox || !signupBox) {

        console.error(
            "❌ Login/signup boxes not found."
        );

        return;
    }

    signupBox.style.display = "none";
    loginBox.style.display = "block";

    document.title =
        "Login - ShrekBook 🧌";

    const signupStatus =
        document.getElementById("signupStatus");

    if (signupStatus) {
        signupStatus.textContent = "";
    }

    const email =
        document.getElementById("email");

    if (email) {
        email.focus();
    }

}


/* ==================================================
   SHOW SIGNUP
================================================== */

function showSignup() {

    const loginBox =
        document.getElementById("loginBox");

    const signupBox =
        document.getElementById("signupBox");

    if (!loginBox || !signupBox) {

        console.error(
            "❌ Login/signup boxes not found."
        );

        return;
    }

    loginBox.style.display = "none";
    signupBox.style.display = "block";

    document.title =
        "Sign Up - ShrekBook 🧌";

    const loginStatus =
        document.getElementById("status");

    if (loginStatus) {
        loginStatus.textContent = "";
    }

    const username =
        document.getElementById("signupUsername");

    if (username) {
        username.focus();
    }

}


/* ==================================================
   LOGIN
================================================== */

async function login() {

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const status =
        document.getElementById("status");

    if (
        !emailInput ||
        !passwordInput ||
        !status
    ) {

        console.error(
            "❌ Login elements missing."
        );

        return;
    }

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email || !password) {

        status.textContent =
            "❌ Enter your email and password.";

        return;
    }


    status.textContent =
        "Logging in...";


    try {

        const response =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );


        let data = {};

        try {

            data =
                await response.json();

        } catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Login failed."
            );

        }


        status.textContent =
            "✅ Login successful!";


        window.location.href = "/";

    }

    catch (error) {

        console.error(
            "❌ LOGIN ERROR:",
            error
        );

        status.textContent =
            "❌ " +
            error.message;

    }

}


/* ==================================================
   SIGNUP
================================================== */

async function signup() {

    const usernameInput =
        document.getElementById(
            "signupUsername"
        );

    const emailInput =
        document.getElementById(
            "signupEmail"
        );

    const passwordInput =
        document.getElementById(
            "signupPassword"
        );

    const confirmInput =
        document.getElementById(
            "signupPasswordConfirm"
        );

    const status =
        document.getElementById(
            "signupStatus"
        );


    if (
        !usernameInput ||
        !emailInput ||
        !passwordInput ||
        !confirmInput ||
        !status
    ) {

        console.error(
            "❌ Signup elements missing."
        );

        return;
    }


    const username =
        usernameInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmInput.value;


    if (
        !username ||
        !email ||
        !password ||
        !confirmPassword
    ) {

        status.textContent =
            "❌ Please fill in all fields.";

        return;
    }


    if (password !== confirmPassword) {

        status.textContent =
            "❌ Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        status.textContent =
            "❌ Password must be at least 6 characters.";

        return;
    }


    status.textContent =
        "Creating account...";


    try {

        const response =
            await fetch(
                "/api/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                }
            );


        let data = {};

        try {

            data =
                await response.json();

        } catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Signup failed."
            );

        }


        console.log(
            "✅ SIGNUP SUCCESS:",
            data
        );


        status.textContent =
            "✅ Account created!";


        /*
         * Switch back to login after signup.
         */

        setTimeout(() => {

            showLogin();

            const loginEmail =
                document.getElementById(
                    "email"
                );

            if (loginEmail) {

                loginEmail.value =
                    email;

            }

        }, 1000);

    }

    catch (error) {

        console.error(
            "❌ SIGNUP ERROR:",
            error
        );

        status.textContent =
            "❌ " +
            error.message;

    }

}


/* ==================================================
   URL SIGNUP SUPPORT
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        console.log(
            "🧌 ShrekBook auth loaded."
        );


        const params =
            new URLSearchParams(
                window.location.search
            );


        if (
            params.get("signup") === "true" ||
            params.get("signup") === "1"
        ) {

            showSignup();

        } else {

            showLogin();

        }

    }
);

</script>

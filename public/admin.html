
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="canonical" href="https://shrekbook.bbroot.com/">

    <title>ShrekBook Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f5e9;
            color: #222;
        }

        header {
            background: #4d7c0f;
            color: white;

            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .admin-info {
            font-size: 14px;
            opacity: 0.95;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .toolbar {
            background: white;
            padding: 15px;

            border-radius: 12px;

            display: flex;
            gap: 10px;
            flex-wrap: wrap;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        input,
        select,
        button {
            font: inherit;
        }

        input,
        select {
            padding: 10px;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;
        }

        input {
            flex: 1;
            min-width: 220px;
        }

        button {
            border: none;
            border-radius: 8px;

            padding: 10px 14px;

            cursor: pointer;

            font-weight: bold;
        }

        button:hover {
            filter: brightness(0.95);
        }

        .refresh {
            background: #65a30d;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .warning {
            background: #f59e0b;
            color: white;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .dark {
            background: #374151;
            color: white;
        }

        .users {
            display: grid;
            gap: 15px;
        }

        .user-card {
            background: white;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .user-top {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            object-fit: cover;

            background: #ddd;
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
        }

        .username {
            color: #666;
            font-size: 14px;
        }

        .role {
            display: inline-block;

            margin-top: 5px;

            padding: 4px 8px;

            border-radius: 999px;

            font-size: 12px;
            font-weight: bold;

            background: #e5e7eb;
        }

        .role.owner {
            background: #facc15;
            color: #713f12;
        }

        .role.administrator {
            background: #c084fc;
            color: #581c87;
        }

        .role.senior_moderator {
            background: #60a5fa;
            color: #1e3a8a;
        }

        .role.junior_moderator {
            background: #93c5fd;
            color: #1e40af;
        }

        .role.peasant {
            background: #d1d5db;
            color: #374151;
        }

        .status {
            font-size: 13px;
            margin-top: 8px;
        }

        .active {
            color: #15803d;
            font-weight: bold;
        }

        .inactive {
            color: #dc2626;
            font-weight: bold;
        }

        .banned {
            color: #991b1b;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions select {
            min-width: 180px;
        }

        #status {
            margin-bottom: 15px;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>

<body>

<header>

    <h1>🧌 ShrekBook Admin Panel</h1>

    <div class="admin-info">
        <span id="current-user">
            Checking admin access...
        </span>
    </div>

</header>


<main>

    <div id="status"></div>


    <div
        id="admin-panel"
        class="hidden"
    >

        <div class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="🔎 Search users..."
            >

            <button
                class="refresh"
                id="refresh-btn"
            >
                🔄 Refresh
            </button>

        </div>


        <div
            id="users"
            class="users"
        ></div>

    </div>

</main>


<script src="/admin.js"></script>

</body>

</html>

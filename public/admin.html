
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShrekBook Admin Panel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4ec;
            color: #1f2a1f;
        }

        header {
            background: #2f6b2f;
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .admin-badge {
            background: #e8c547;
            color: #222;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .topbar h2 {
            margin: 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .refresh {
            background: #2f6b2f;
            color: white;
        }

        .revoke {
            background: #d89b18;
            color: white;
        }

        .kick {
            background: #c0392b;
            color: white;
        }

        .reactivate {
            background: #2980b9;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        .info {
            flex: 1;
            min-width: 200px;
        }

        .username {
            font-size: 18px;
            font-weight: bold;
        }

        .display-name {
            color: #666;
        }

        .role {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 8px;
            border-radius: 12px;
            background: #eee;
            font-size: 12px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            margin-left: 5px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #d4edda;
            color: #155724;
        }

        .inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

    </style>

</head>

<body>

<header>

    <h1>🧌 ShrekBook Admin Panel</h1>

    <div class="admin-badge">
        👑 ADMIN
    </div>

</header>


<main>

    <div class="panel">

        <div class="topbar">

            <h2>Users</h2>

            <button
                class="refresh"
                onclick="loadUsers()"
            >
                🔄 Refresh
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div
            id="user-list"
            class="user-list"
        >
            Loading users...
        </div>

    </div>

</main>


<script src="/admin.js"></script>

</body>

</html>

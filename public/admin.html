
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShrekBook Admin</title>
    <meta name="description" content="ShrekBook administration panel.">
    <meta name="robots" content="noindex, nofollow">
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            background: #f4f4f4;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        #admin-info {
            color: #666;
            margin-bottom: 25px;
        }

        #message {
            display: none;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        #message.success {
            display: block;
            background: #d9f7df;
            color: #146b2d;
        }

        #message.error {
            display: block;
            background: #ffdede;
            color: #9b1c1c;
        }

        .toolbar {
            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        #search {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        button,
        select {

            padding: 9px 12px;

            border: 0;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

        }

        button:hover {
            opacity: .85;
        }

        .refresh {
            background: #333;
            color: white;
        }

        .users {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .user-card {

            background: white;

            border-radius: 12px;

            padding: 18px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, .08);

        }

        .user-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
        }

        .username {
            color: #777;
            margin-top: 3px;
        }

        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .badge {

            padding: 4px 8px;

            border-radius: 20px;

            background: #eee;

            font-size: 12px;

        }

        .badge.banned {
            background: #ffcccc;
            color: #8a0000;
        }

        .badge.kicked {
            background: #ffe5b3;
            color: #7a4a00;
        }

        .actions {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 15px;

        }

        .role-button {
            background: #4d6cff;
            color: white;
        }

        .ban-button {
            background: #d93025;
            color: white;
        }

        .unban-button {
            background: #188038;
            color: white;
        }

        .kick-button {
            background: #f29900;
            color: white;
        }

        .clear-kick-button {
            background: #777;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🛡️ ShrekBook Admin Panel</h1>

    <div id="admin-info">
        Checking administrator access...
    </div>

    <div id="message"></div>

    <div class="toolbar">

        <input
            id="search"
            type="text"
            placeholder="Search users..."
        >

        <button
            class="refresh"
            onclick="loadUsers()"
        >
            Refresh
        </button>

    </div>

    <div
        id="users"
        class="users"
    >

        <div class="loading">
            Loading users...
        </div>

    </div>
    <div class="admin-password-reset">

        <h3>🔐 Reset User Password</h3>

        <input
            id="resetUserId"
            type="text"
            placeholder="User ID"
        >

        <input
            id="resetNewPassword"
            type="password"
            placeholder="New temporary password"
        >

        <button onclick="resetUserPassword()">
            🔐 Reset Password
        </button>

        <p id="resetPasswordStatus"></p>

    </div>

</div>

<script src="/admin.js"></script>

</body>

</html>
